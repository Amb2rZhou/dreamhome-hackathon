<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="dreamhome-capability" content="asset-share-v1" />
  <title>DreamHome · 3D 资产分享</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;color:#263229;background:#f3efe6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 86% 8%,#fff 0 11%,transparent 31%),linear-gradient(145deg,#f8f2e8,#dce7da)}button,a{font:inherit}.shell{width:min(1180px,100%);min-height:100vh;margin:auto;padding:clamp(18px,4vw,48px);display:grid;grid-template-rows:auto 1fr auto;gap:20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{letter-spacing:.1em;font-size:13px;font-weight:800;color:#607260}h1{margin:8px 0 0;font-size:clamp(28px,5vw,56px);line-height:1.05}.actions{display:flex;gap:8px}.share,.assemble{border:0;border-radius:999px;padding:12px 18px;cursor:pointer;text-decoration:none}.share{color:#2e4233;background:#fff}.assemble{color:#fff;background:#2e4233;font-weight:750}main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:18px}.stage{position:relative;min-height:520px;overflow:hidden;border-radius:32px;background:rgba(255,255,255,.7);box-shadow:0 24px 70px rgba(47,65,50,.15)}canvas{width:100%;height:100%;display:block;touch-action:none}.status{position:absolute;inset:auto 18px 18px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);color:#617063;font-size:13px}.list{display:flex;flex-direction:column;gap:10px;overflow:auto}.asset{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;width:100%;padding:10px;border:1px solid transparent;border-radius:18px;background:rgba(255,255,255,.62);text-align:left;cursor:pointer}.asset[aria-current="true"]{border-color:#789078;background:#fff;box-shadow:0 10px 28px rgba(55,75,58,.12)}.asset img,.placeholder{width:54px;height:54px;border-radius:14px;object-fit:cover;background:#d9e1d6;display:grid;place-items:center}.asset b{display:block;font-size:14px}.asset small{color:#718073}.direct{color:#405943;text-decoration:none;font-weight:700}footer{display:flex;justify-content:space-between;gap:14px;color:#6e7b70;font-size:13px}[hidden]{display:none!important}@media(max-width:760px){.shell{padding:18px}.brand{font-size:11px}header{align-items:flex-start}.actions{flex-direction:column}.share,.assemble{padding:10px 14px}main{grid-template-columns:1fr}.stage{min-height:56vh}.list{flex-direction:row}.asset{min-width:190px}footer{display:block}}
  </style>
  <script type="importmap">{"imports":{"three":"../../../vendor/three.module.js","three/addons/":"../../../vendor/three-addons/"}}</script>
</head>
<body data-page="dreamhome-asset-share-v1">
  <div class="shell">
    <header><div><div class="brand">DREAMHOME · 梦想家</div><h1 id="title">3D 资产分享</h1></div><div class="actions"><button class="share" id="share">分享</button><a class="assemble" id="assemble" href="#" hidden>加入我的 3D 空间</a></div></header>
    <main><section class="stage"><canvas id="canvas"></canvas><div class="status" id="status">正在读取分享内容…</div></section><aside class="list" id="list" aria-label="3D 资产列表"></aside></main>
    <footer><span>拖动旋转 · 双指或滚轮缩放</span><a class="direct" id="direct" href="#" target="_blank" rel="noopener">下载当前 GLB</a></footer>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    const query=new URLSearchParams(location.search),slug=query.get('share')||'',api=(query.get('apiBase')||'https://api.dreamhouse.top').replace(/\/$/,'');
    const title=document.getElementById('title'),list=document.getElementById('list'),status=document.getElementById('status'),direct=document.getElementById('direct'),assemble=document.getElementById('assemble'),canvas=document.getElementById('canvas');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.01,100),controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.target.set(0,.65,0);
    scene.add(new THREE.HemisphereLight(0xffffff,0xa7b6a2,2.3));const key=new THREE.DirectionalLight(0xffffff,2.6);key.position.set(4,7,5);key.castShadow=true;scene.add(key);const ground=new THREE.Mesh(new THREE.CircleGeometry(2.8,64),new THREE.MeshStandardMaterial({color:0xe7e4da,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
    let active=null,assets=[];
    function resize(){const rect=canvas.parentElement.getBoundingClientRect();renderer.setSize(rect.width,rect.height,false);camera.aspect=rect.width/rect.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas.parentElement);resize();
    function dispose(object){object?.traverse(node=>{node.geometry?.dispose?.();const materials=Array.isArray(node.material)?node.material:[node.material];materials.filter(Boolean).forEach(material=>{Object.values(material).forEach(value=>value?.isTexture&&value.dispose());material.dispose?.()})})}
    async function show(index){const asset=assets[index];if(!asset)return;if(active){scene.remove(active);dispose(active);active=null}[...list.children].forEach((node,itemIndex)=>node.setAttribute('aria-current',String(itemIndex===index)));title.textContent=asset.name||'DreamHome 3D 资产';direct.href=asset.model_url;status.hidden=false;status.textContent='3D 模型加载中…';try{const gltf=await new GLTFLoader().loadAsync(asset.model_url);active=gltf.scene;const box=new THREE.Box3().setFromObject(active),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),max=Math.max(size.x,size.y,size.z)||1;active.position.sub(center);active.scale.setScalar(1.75/max);const scaled=new THREE.Box3().setFromObject(active);active.position.y-=scaled.min.y;active.traverse(node=>{if(node.isMesh){node.castShadow=true;node.receiveShadow=true}});scene.add(active);camera.position.set(2.6,1.8,3.2);controls.target.set(0,Math.min(1,scaled.getSize(new THREE.Vector3()).y*.45),0);controls.update();status.hidden=true}catch(error){console.error(error);status.hidden=false;status.textContent='交互模型加载失败，可使用下方 GLB 下载链接。'}}
    function renderList(){list.replaceChildren(...assets.map((asset,index)=>{const button=document.createElement('button');button.className='asset';button.type='button';button.addEventListener('click',()=>show(index));const visual=asset.thumbnail_url?Object.assign(document.createElement('img'),{src:asset.thumbnail_url,alt:''}):Object.assign(document.createElement('span'),{className:'placeholder',textContent:'3D'});const copy=document.createElement('span'),name=document.createElement('b'),meta=document.createElement('small');name.textContent=asset.name||'3D 资产';meta.textContent=asset.labels?.category||'可旋转查看';copy.append(name,meta);button.append(visual,copy);return button}))}
    async function boot(){if(!slug)throw new Error('分享编号缺失');const response=await fetch(`${api}/api/publishes/${encodeURIComponent(slug)}`);if(!response.ok)throw new Error(`分享读取失败 (${response.status})`);const payload=await response.json();assets=payload.document?.assets||[];if(!assets.length)throw new Error('分享中没有可用资产');document.title=`${payload.title} · DreamHome`;title.textContent=payload.title;const assemblyUrl=new URL('../my-home/index.html',location.href);assemblyUrl.searchParams.set('assetShare',slug);assemblyUrl.searchParams.set('apiBase',api);assemble.href=assemblyUrl.href;assemble.hidden=false;renderList();await show(0)}
    document.getElementById('share').addEventListener('click',async()=>{const data={title:document.title,text:'来看看这个 DreamHome 3D 资产',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);status.hidden=false;status.textContent='分享链接已复制'}}catch(error){if(error?.name!=='AbortError'){status.hidden=false;status.textContent='分享没有完成，请重试'}}});
    renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});boot().catch(error=>{status.hidden=false;status.textContent=error.message;direct.hidden=true;assemble.hidden=true});
  </script>
</body>
</html>
