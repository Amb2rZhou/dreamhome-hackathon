<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5fbf6" />
  <title>DreamHome · 灵感库</title>
  <link rel="stylesheet" href="./dreamhome-d-system.css" />
  <link rel="stylesheet" href="../shared/tabbar.css" />
  <style>
    body { margin:0; min-height:100vh; background:linear-gradient(90deg,#faf4e6,#fefdf8 48%,#f8f2e3); color:var(--dh-fg-primary); font-family:var(--dh-font-sans); }
    .preview-stage { min-height:100vh; display:grid; place-items:center; padding:28px 18px; box-sizing:border-box; }
    .library-shell { position:relative; }.library-app { height:calc(100% - 50px); padding:0 16px; display:flex; flex-direction:column; box-sizing:border-box; overflow:hidden; }
    .status-icons { display:flex; align-items:center; gap:5px; height:17px; transform:translateY(-6px); }.status-time { font-size:15px; font-weight:var(--dh-font-weight-bold); transform:translateY(-3px); }.bars { display:flex; gap:2px; align-items:end; height:13px; }.bars i { width:3px; border-radius:2px; background:currentColor; }.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:9px}.bars i:nth-child(3){height:12px}.bat { width:23px;height:12px;border:1.5px solid currentColor;border-radius:3px;position:relative; }.bat::before{content:"";position:absolute;inset:2px;width:13px;background:currentColor;border-radius:1px}.bat::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:2px}
    .library-header { display:grid; place-items:center; min-height:42px; padding-top:3px; }.library-header[hidden]{display:none}.library-header.is-catalog{display:block;place-items:unset;padding:2px 0 7px}.library-title{margin:0;font-size:16px;letter-spacing:0;font-weight:var(--dh-font-weight-heavy)}
    /* 主页面顶栏白栏：状态栏 + 标题栏统一为底部导航同色；次级页（全部/查看全部）由 JS 移除 dh-topwhite 保持原透明 */
    .dh-screen.dh-topwhite .dh-statusbar { background: var(--dh-bg-surface); }
    .dh-screen.dh-topwhite .library-header { background: var(--dh-bg-surface); margin:0 -16px; padding-left:16px; padding-right:16px; box-shadow:0 2px 6px rgba(175,135,65,.06); }
    .library-content { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:14px 0 var(--dh-tabbar-safe-space); scrollbar-width:none; }.library-content::-webkit-scrollbar{display:none}.catalog-view[hidden],.library-home[hidden]{display:none!important}
    /* 顶部 banner 轮播 */
    .library-banner{margin:0 0 16px}.library-banner[hidden]{display:none}
    .hero-viewport{overflow:hidden;border-radius:14px;box-shadow:0 5px 14px rgba(69,89,67,.09);touch-action:pan-y;user-select:none}
    .hero-track{display:flex;transition:transform .32s cubic-bezier(.32,.72,0,1);will-change:transform}
    .hero-slide{flex:0 0 100%;height:138px;box-sizing:border-box;position:relative;overflow:hidden}
    .hero-slide--mood{display:flex;align-items:center;justify-content:flex-end;padding:0 8px;background:#fdf6e8 url(../../assets/banners/mood.jpg) center/cover no-repeat}
    .hero-mascot{height:94px;width:auto;object-fit:contain;flex:none;pointer-events:none}
    .hero-bubble{position:absolute;left:14px;top:50%;transform:translateY(-50%);max-width:none;padding:8px 11px;border-radius:14px;background:rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(69,89,67,.16);color:var(--dh-fg-primary);font-size:12px;font-weight:var(--dh-font-weight-bold);line-height:1.4}
    .hero-bubble::after{content:"";position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:9px solid rgba(255,255,255,.95)}.hero-bubble .bl{display:block;white-space:nowrap;letter-spacing:.01em}.hero-bubble .bl + .bl{margin-top:3px}
    .hero-slide--case{cursor:pointer;padding:11px 14px;display:flex;flex-direction:column;background-size:cover;background-position:center}
    .hero-slide--case::after{content:"";position:absolute;inset:0;background:linear-gradient(85deg,rgba(20,26,21,.5),rgba(20,26,21,.05));z-index:0}
    .hero-slide--case>*{position:relative;z-index:1}
    .hero-case-tag{align-self:flex-start;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--dh-color-sage-800);font-size:10px;font-weight:var(--dh-font-weight-heavy)}
    .hero-case-foot{margin-top:auto;color:#fff}.hero-case-blogger{font-size:13px;font-weight:var(--dh-font-weight-heavy);text-shadow:0 1px 4px rgba(0,0,0,.3)}.hero-case-cta{margin-top:1px;font-size:10px;font-weight:var(--dh-font-weight-semibold);opacity:.92}
    .hero-dots{display:flex;justify-content:center;gap:6px;margin-top:8px}.hero-dots i{width:6px;height:6px;border-radius:50%;background:rgba(93,115,91,.28);transition:.2s ease}.hero-dots i.is-active{width:16px;border-radius:3px;background:var(--dh-color-sage-600)}
    .viewer-actions{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px}
    .viewer-fav{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 15px;border:1px solid rgba(190,105,89,.4);border-radius:999px;background:#fff4ef;color:#be6959;font:inherit;font-size:12px;font-weight:var(--dh-font-weight-bold);cursor:pointer;transition:background .15s ease,color .15s ease}
    .viewer-fav .vf-heart{font-size:13px;line-height:1}
    .viewer-fav[aria-pressed="true"]{background:#be6959;color:#fff;border-color:#be6959}
    /* 弹窗左上角风格标识：文案即 tag 原文，不加「风格」字样。资产最多 2 个风格标签 */
    .viewer-styles{position:absolute;z-index:2;left:22px;top:22px;display:flex;gap:4px;pointer-events:none}.viewer-styles:empty{display:none}
    .vs-tag{padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:#8a5f2e;font-size:9px;font-weight:var(--dh-font-weight-heavy);line-height:1;letter-spacing:.01em;box-shadow:0 1px 4px rgba(44,59,45,.16)}
    .viewer-source{width:32px;height:32px;padding:0;border:1px solid rgba(110,132,107,.3);border-radius:50%;background:#fff;color:var(--dh-color-sage-700);display:inline-grid;place-items:center;cursor:pointer}.viewer-source svg{width:16px;height:16px}.viewer-source[hidden]{display:none}
    .confirm-modal{position:absolute;inset:0;z-index:64;display:flex;align-items:center;justify-content:center;padding:0 28px}.confirm-modal[hidden]{display:none}
    .confirm-backdrop{position:absolute;inset:0;background:rgba(20,26,21,.5);opacity:0;transition:opacity .2s ease}.confirm-modal.is-open .confirm-backdrop{opacity:1}
    .confirm-card{position:relative;width:100%;max-width:252px;padding:20px 18px 16px;border-radius:22px;background:#fff;box-shadow:0 18px 40px rgba(29,36,31,.3);text-align:center;transform:scale(.94);opacity:0;transition:transform .2s cubic-bezier(.32,.72,0,1),opacity .2s ease}.confirm-modal.is-open .confirm-card{transform:scale(1);opacity:1}
    .confirm-card b{display:block;font-size:15px;font-weight:var(--dh-font-weight-heavy)}
    .confirm-card p{margin:11px 0 18px;min-height:32px;display:flex;align-items:center;justify-content:center;color:var(--dh-fg-secondary);font-size:12px;font-weight:var(--dh-font-weight-semibold);line-height:1.5}
    .confirm-actions{display:flex;gap:10px}.confirm-actions button{flex:1;min-height:42px;border:0;border-radius:13px;font:inherit;font-size:13px;font-weight:var(--dh-font-weight-bold);cursor:pointer}.confirm-cancel{background:rgba(250,241,220,.9);color:var(--dh-fg-secondary)}.confirm-ok{background:#be6959;color:#fff;box-shadow:0 8px 18px rgba(150,70,55,.3)}
    .viewer-name-row{display:flex;justify-content:center}.viewer-name-wrap{position:relative;display:inline-flex;max-width:180px}.viewer-name-wrap .viewer-name{width:auto;max-width:180px}
    .viewer-stage .component-visual{width:100%;height:100%;border:0;border-radius:16px;box-shadow:none}
    /* 真实资产照片缩略图（卡片 + viewer） */
    .visual--photo{background:#f4ecdb}.visual--photo img{width:100%;height:100%;object-fit:contain;display:block}.visual--photo .thumbnail-fallback{display:none}.visual--photo.is-broken img{display:none}.visual--photo.is-broken .thumbnail-fallback{display:block}
    .viewer-photo{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 42% 34%,#fbfdf9,#f4ecdb 70%,#dbe6d4)}.viewer-photo img{width:100%;height:100%;object-fit:contain}.viewer-photo-note{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);padding:4px 10px;border-radius:999px;background:rgba(29,36,31,.55);color:#fff;font-size:9px;font-weight:var(--dh-font-weight-semibold);pointer-events:none}
    .catalog-section { margin-bottom:16px; padding:11px 10px 12px; border:1px solid rgba(117,139,113,.18); border-radius:14px; background:rgba(255,255,255,.9); box-shadow:0 5px 14px rgba(69,89,67,.07); }.section-head { display:flex; align-items:center; justify-content:space-between; min-height:27px; margin-bottom:8px; }.section-tag { width:max-content; padding:5px 7px; border-radius:7px; background:var(--dh-color-sage-100); color:var(--dh-color-sage-800); font-size:11px; font-weight:var(--dh-font-weight-heavy); letter-spacing:0; }.all-button,.catalog-back { border:0; padding:4px 0; background:transparent; color:var(--dh-color-sage-700); font:inherit; font-size:11px; font-weight:var(--dh-font-weight-heavy); cursor:pointer; }
    .component-rail { display:flex; flex-wrap:nowrap; gap:9px; overflow-x:auto; overscroll-behavior-x:contain; margin:0 -2px; padding:3px 3px 7px; scrollbar-width:none; }.component-rail::-webkit-scrollbar{display:none}.component-card,.furniture-card { position:relative; }.component-card { flex:0 0 79px; min-width:0; border:0; padding:0; background:transparent; color:inherit; text-align:left; cursor:pointer; }.component-card--floorplan b{font-size:9px}.component-visual { position:relative; height:72px; overflow:hidden; border:var(--dh-card-border); border-radius:8px; background:#f7efe0; box-shadow:var(--dh-shadow-soft); }.component-card b{display:block;overflow:hidden;margin:6px 1px 0;font-size:10px;letter-spacing:0;text-overflow:ellipsis;white-space:nowrap}.favorite-control{position:absolute;z-index:3;right:4px;top:4px;width:21px;height:21px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.87);color:var(--dh-color-sage-600);font-size:12px;line-height:1;cursor:pointer;box-shadow:0 2px 5px rgba(44,59,45,.13)}.favorite-control[aria-pressed="true"]{color:#be6959;background:#fff4ef}.source-badge{position:absolute;z-index:2;left:4px;top:4px;max-width:calc(100% - 34px);overflow:hidden;padding:3px 5px;border-radius:999px;background:rgba(65,78,64,.82);color:#fff;font-size:8px;font-weight:var(--dh-font-weight-bold);line-height:1;letter-spacing:.01em;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
    .visual--floorplan{background:linear-gradient(135deg,#f7ecd5,#fffdf6)}.visual--floorplan canvas{display:block;width:100%;height:100%;background-size:cover;background-position:center;background-repeat:no-repeat}
    .furniture-tabs { display:flex; gap:6px; overflow-x:auto; margin:0 -2px; padding:1px 3px 9px; scrollbar-width:none; }.furniture-tabs::-webkit-scrollbar{display:none}.furniture-tab{flex:0 0 auto;border:1px solid rgba(110,132,107,.2);border-radius:999px;padding:5px 9px;background:rgba(255,255,255,.62);color:var(--dh-fg-secondary);font:inherit;font-size:10px;font-weight:var(--dh-font-weight-bold);cursor:pointer}.furniture-tab[aria-selected="true"]{border-color:var(--dh-color-sage-600);background:var(--dh-color-sage-600);color:white}
    .furniture-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px 7px; }.furniture-card{min-width:0;border:0;padding:0;background:transparent;color:inherit;text-align:left;cursor:pointer}.furniture-card .component-visual{height:62px}.furniture-card b{display:block;margin:5px 1px 0;overflow:hidden;font-size:9px;font-weight:var(--dh-font-weight-bold);text-overflow:ellipsis;white-space:nowrap}.visual--furniture{background:linear-gradient(145deg,#f7efe0,#fffaf2)}.object{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);background:var(--object);box-shadow:inset 0 8px rgba(255,255,255,.18)}.object--sofa{width:47px;height:22px;border-radius:12px 12px 5px 5px}.object--sofa::before{content:"";position:absolute;left:9px;top:-12px;width:29px;height:16px;border-radius:9px 9px 3px 3px;background:var(--accent)}.object--chair{width:25px;height:23px;border-radius:7px 7px 4px 4px}.object--chair::before{content:"";position:absolute;left:4px;top:-14px;width:17px;height:18px;border-radius:7px 7px 2px 2px;background:var(--accent)}.object--table{width:42px;height:15px;border-radius:50%;bottom:18px}.object--table::before{content:"";position:absolute;left:19px;top:12px;width:4px;height:20px;background:var(--accent)}.object--lamp{width:4px;height:36px;border-radius:2px;bottom:9px}.object--lamp::before{content:"";position:absolute;left:-10px;top:-10px;width:24px;height:13px;border-radius:50% 50% 3px 3px;background:var(--accent)}.object--bed{width:46px;height:25px;border-radius:5px}.object--bed::before{content:"";position:absolute;left:5px;top:4px;width:35px;height:10px;border-radius:4px;background:var(--accent)}.object--cabinet{width:39px;height:29px;border-radius:3px}.object--plant{width:22px;height:23px;border-radius:45% 55% 38% 62%;background:var(--accent)}.object--plant::before{content:"";position:absolute;left:-7px;top:-8px;width:15px;height:22px;border-radius:50% 0 50% 0;background:var(--object)}.all-card{display:grid;place-items:center;height:62px;align-self:start;border:1px dashed rgba(150,112,58,.5)!important;border-radius:8px!important;background:rgba(245,236,215,.52)!important;color:var(--dh-color-sage-800)!important;font-size:10px;font-weight:var(--dh-font-weight-heavy);text-align:center}.all-card span{max-width:46px}
    /* ---- 全部页筛选条：只展示已选标签，条件在半屏 sheet 里改 ---- */
    .filter-bar{display:flex;align-items:center;gap:8px;margin:0 -2px 12px;padding:1px 2px}
    .filter-open{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 11px;border:1px solid rgba(181,140,70,.32);border-radius:999px;background:#fdf7ea;color:#8a5f2e;font:inherit;font-size:11px;font-weight:var(--dh-font-weight-heavy);cursor:pointer}
    .filter-open svg{width:14px;height:14px}.filter-open em{font-style:normal;min-width:15px;height:15px;display:grid;place-items:center;border-radius:999px;background:#be6959;color:#fff;font-size:9px}
    .filter-tags{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.filter-tags::-webkit-scrollbar{display:none}
    .filter-tag{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 9px;border:1px solid #deb08c;border-radius:999px;background:#fbf3e1;color:#8a5f2e;font:inherit;font-size:10px;font-weight:var(--dh-font-weight-bold);white-space:nowrap;cursor:pointer}
    .filter-tag i{font-style:normal;font-size:9px;opacity:.7}
    .filter-hint{color:var(--dh-fg-muted);font-size:10px;font-weight:var(--dh-font-weight-semibold);white-space:nowrap;align-self:center}
    .filter-clear{flex:0 0 auto;border:0;padding:4px 2px;background:transparent;color:var(--dh-color-sage-700);font:inherit;font-size:10px;font-weight:var(--dh-font-weight-heavy);cursor:pointer}
    /* ---- 筛选 sheet ---- */
    .fs-scroll{max-height:46vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}.fs-scroll::-webkit-scrollbar{display:none}
    .fs-group{margin-bottom:14px}.fs-label{margin-bottom:8px;color:var(--dh-fg-secondary);font-size:11px;font-weight:var(--dh-font-weight-heavy)}
    .fs-opts{display:flex;flex-wrap:wrap;gap:7px}
    .fs-opt{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 11px;border:1px solid rgba(117,139,113,.22);border-radius:999px;background:rgba(255,255,255,.9);color:var(--dh-fg-secondary);font:inherit;font-size:11px;font-weight:var(--dh-font-weight-bold);cursor:pointer}
    .fs-opt span{color:var(--dh-fg-muted);font-size:9px;font-weight:var(--dh-font-weight-semibold);font-variant-numeric:tabular-nums}
    .fs-opt.is-on{border-color:#deb08c;background:#fbf3e1;color:#8a5f2e}.fs-opt.is-on span{color:#b58c46}
    .fs-opt[disabled]{opacity:.34;cursor:not-allowed}
    .fs-actions{display:flex;gap:10px;margin-top:6px;padding-top:12px;border-top:1px solid rgba(117,139,113,.14)}
    .fs-reset{flex:0 0 88px;min-height:44px;border:1px solid rgba(117,139,113,.3);border-radius:13px;background:#fff;color:var(--dh-fg-secondary);font:inherit;font-size:13px;font-weight:var(--dh-font-weight-bold);cursor:pointer}.fs-reset[disabled]{opacity:.4;cursor:not-allowed}
    .fs-apply{flex:1;min-height:44px;border:0;border-radius:13px;background:#be6959;color:#fff;font:inherit;font-size:13px;font-weight:var(--dh-font-weight-bold);cursor:pointer;box-shadow:0 8px 18px rgba(150,70,55,.28)}.fs-apply[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed}
    /* ---- 主页功能图标栏（参考酷家乐主入口）---- */
    .fn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 16px;padding:12px 4px;border-radius:16px;background:rgba(255,255,255,.86);border:1px solid rgba(117,139,113,.16);box-shadow:0 5px 14px rgba(69,89,67,.07)}
    .fn-item{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;padding:0;background:transparent;color:inherit;font:inherit;cursor:pointer}
    .fn-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;overflow:hidden;background:linear-gradient(150deg,#fdf6e6,#f7ebd0)}
    /* 图标是抠好的透明 PNG（3 倍图），底色与投影都由 CSS 画：调色只改这里，不用重新出图 */
    .fn-icon img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1.5px 2px rgba(92,72,52,.22))}
    .fn-icon--cases{background:linear-gradient(150deg,#fdf0ec,#f8ddd5)}.fn-icon--floorplan{background:linear-gradient(150deg,#edf2f4,#d9e4ea)}
    .fn-icon--furniture{background:linear-gradient(150deg,#fdf6e6,#f7ebd0)}.fn-icon--styles{background:linear-gradient(150deg,#f5f2ec,#e9e3d8)}
    .fn-item b{font-size:11px;font-weight:var(--dh-font-weight-heavy);letter-spacing:.01em}

    /* ---- 找案例列表 ---- */
    .case-list{display:flex;flex-direction:column;gap:12px}
    .case-tile{position:relative;height:132px;border:0;padding:0;border-radius:14px;background-size:cover;background-position:center;box-shadow:0 5px 14px rgba(69,89,67,.12);cursor:pointer;overflow:hidden;display:flex;align-items:flex-end}
    .case-tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,26,21,0) 46%,rgba(20,26,21,.66))}
    .case-tile-foot{position:relative;z-index:1;width:100%;padding:10px 13px;text-align:left;color:#fff}.case-tile-foot b{display:block;font-size:13px;font-weight:var(--dh-font-weight-heavy);text-shadow:0 1px 4px rgba(0,0,0,.35)}.case-tile-foot span{font-size:10px;font-weight:var(--dh-font-weight-semibold);opacity:.92}.case-tile-foot i{font-style:normal}

    /* ---- 风格图鉴：内容页，不列商品 ---- */
    .sg-list{display:flex;flex-direction:column;gap:10px}
    .sg-card{display:flex;align-items:center;gap:11px;padding:9px;border:1px solid rgba(117,139,113,.16);border-radius:14px;background:rgba(255,255,255,.92);color:inherit;font:inherit;text-align:left;cursor:pointer;box-shadow:0 4px 12px rgba(69,89,67,.07)}
    .sg-cover{flex:0 0 62px;height:62px;border-radius:11px;background:#f7efe0 center/78% auto no-repeat;box-shadow:inset 0 0 0 1px rgba(150,112,58,.12)}
    .sg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    .sg-body b{font-size:13px;font-weight:var(--dh-font-weight-heavy)}
    .sg-desc{overflow:hidden;color:var(--dh-fg-secondary);font-size:10px;font-weight:var(--dh-font-weight-semibold);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .sg-n{color:var(--dh-fg-muted);font-size:9.5px;font-weight:var(--dh-font-weight-bold);font-variant-numeric:tabular-nums}
    .sg-card i{flex:none;color:var(--dh-color-sage-700);font-size:17px;font-style:normal}
    .sg-more{margin-top:14px}.sg-more summary{padding:9px 2px;color:var(--dh-color-sage-800);font-size:11px;font-weight:var(--dh-font-weight-heavy);cursor:pointer}.sg-more summary::marker{color:var(--dh-color-sage-600)}.sg-more .sg-list{margin-top:8px}

    /* ---- 风格详情页 ---- */
    .sg-intro{margin:0 0 14px;color:var(--dh-fg-secondary);font-size:13px;font-weight:var(--dh-font-weight-bold);line-height:1.55}
    .sd-count{margin:0 0 10px;color:var(--dh-fg-muted);font-size:11px;font-weight:var(--dh-font-weight-bold);font-variant-numeric:tabular-nums}
    .sd-hero{margin-bottom:13px;padding:15px 15px 16px;border-radius:14px;box-shadow:0 4px 12px rgba(69,89,67,.08)}
    .sd-hero b{display:block;margin-bottom:5px;font-size:19px;font-weight:var(--dh-font-weight-heavy);letter-spacing:.01em;color:#3f382f}
    .sd-hero > span{display:block;color:#5d5347;font-size:11.5px;font-weight:var(--dh-font-weight-semibold);line-height:1.6}

  <script type="module">
    import { COMPONENT_FAMILIES, FURNITURE_CATEGORIES, getAssets, getAsset, getFavorites, toggleFavorite, removeUserAsset, addUserAsset, sourceFeedHref, syncBackendUserAssets } from '../shared/asset-library-data.js?v=20260810c';

    const home = document.querySelector('#libraryHome');
    const catalog = document.querySelector('#catalogView');
    const libraryContent = document.querySelector('.library-content');
    const screenEl = document.querySelector('.dh-screen'); // 顶栏白栏仅主页开启

    const libraryHeader = document.getElementById('libraryHeader');

    let activeFurnitureCategory = 'all';

    const view = { kind: '', category: '', favoriteOnly: false, caseId: '', styleId: '' };
    // 全部页筛选：品类与风格两组，组内多选取并集、组间取交集（手机端标准筛选器语义）。
    // 用筛选器而非 chip 栏，是因为手机端两排 chip 太挤，且 chip 栏无法在「全部」页切品类。
    const filter = { categories: new Set(), styles: new Set() };
    const filterEmpty = () => !filter.categories.size && !filter.styles.size;
    const applyFilter = (assets, cats = filter.categories, styles = filter.styles) => assets.filter((asset) =>
      (!cats.size || cats.has(asset.category)) && (!styles.size || (asset.styles || []).some((style) => styles.has(style))));

    // 风格分面：完全由当前资产集算出，不硬编码任何风格名单——
    // 风格 tag 体系归 Amber，她增删风格后这里自动跟着变，前端不做同义词合并等数据判断。
    const styleFacets = (assets) => {
      const count = new Map();
      assets.forEach((asset) => (asset.styles || []).forEach((style) => count.set(style, (count.get(style) || 0) + 1)));
      return [...count.entries()]
        // 覆盖全集的风格等于没筛（如「家电」10 件全是现代），去掉避免给用户假选项
        .filter(([, n]) => n < assets.length)
        .map(([name, n]) => ({ name, n }))
        .sort((a, b) => b.n - a.n || a.name.localeCompare(b.name, 'zh'));
    };

    const CASE_INDEX = [
      { videoId: 'vid_91fe552c5f7d', cover: '../../assets/scenes/vid_91fe552c5f7d.jpg', tag: '48平长厅公寓', blogger: '@云上的小路', countLabel: '15 件组件 · 44.2㎡ · 4.8 × 9.2 m', href: '../my-home/index.html?home=video-vid_91fe552c5f7d&mode=edit&demo=1' },

    const roomSpec = (scene) => {

    const SCENE_ROOT = '../../assets/demo-backend/scenes';
    // 主页功能图标栏：灵感库能逛的四类内容各一个入口。件数在渲染时实时算，不写死。

      styles: `${styleFacets(getAssets('furniture')).length} 种`,
    });    const caseCache = new Map();
    const caseMetaOf = (videoId) => CASE_INDEX.find((item) => item.videoId === videoId) || null;

    // 仅供把当前浏览器的收藏选择固化为演示默认值；普通访问不会显示或触发。
    if (new URLSearchParams(location.search).get('exportFavorites') === '1') {

    }

    const labelByKind = Object.fromEntries(COMPONENT_FAMILIES.map((family) => [family.id, family.label]));
    const isUser = (asset) => asset?.source === 'user';
    const showToast = (message) => { toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1500); };
    const favoriteButton = (asset) => `<button class="favorite-control" data-favorite="${asset.id}" aria-label="收藏 ${asset.name}" aria-pressed="${getFavorites().has(asset.id)}">${getFavorites().has(asset.id) ? '♥' : '♡'}</button>`;
    const sourceBadge = (asset) => asset.sourceType === 'offline_photo' ? '<span class="source-badge">拍照生成</span>' : '';
    const visual = (asset) => {

    // 选择模式下：用户组件带勾选框，平台资产变灰锁定

      }
      return `<article class="${className}" data-asset="${asset.id}" tabindex="0">${favoriteButton(asset)}${sourceBadge(asset)}${visual(asset)}<b>${asset.name}</b></article>`;
    };
    const openCatalog = (kind, category = '') => { location.hash = `catalog=${kind}${category ? `:${encodeURIComponent(category)}` : ''}`; }; // 中文子类需编码
    // ---------- 顶部 banner 轮播（情绪引导卡 + 平台案例卡；真机用 <swiper circular>） ----------
    // 案例卡复用对应 1:1 重建场景的真实封面，确保入口预览与进入后的房间一致。
    // tag 同样不写面积：原来的 45㎡/78㎡ 是博主整套房子的名义面积，与点进去后按 scene.room 实算的
    // 房间面积（21.8㎡ / 19.4㎡）自相矛盾。与 CASE_INDEX 保持一致，只留风格名。
    const BANNER_CASES = [
      { id: 'case-oak', videoId: 'vid_40734d7f2e6c', image: '../../assets/scenes/vid_40734d7f2e6c.jpg?v=approved-room', tag: '原木侘寂', blogger: '@鸡蛋灌饼的家' },
      { id: 'case-cream', videoId: 'vid_5f32a0ac954a', image: '../../assets/scenes/vid_5f32a0ac954a.jpg', tag: '奶油风', blogger: '@栗子设计日记' },
    ];
    // 无缝循环：两端各加一张克隆，滑到克隆帧后在 transitionend 里瞬移回真实帧。向右滑=前进（第3张→第1张顺向切入）。
    let bannerPos = 1;        // 轨道位置：真实第 i 张在 pos=i+1
    let bannerN = 0;
    let bannerDragged = false;
    let bannerAnimating = false;
    const paintBanner = (animate) => {
      const track = libraryBanner.querySelector('#heroTrack');
      if (!track || !bannerN) return;
      track.style.transition = animate ? 'transform .32s cubic-bezier(.32,.72,0,1)' : 'none';
      track.style.transform = `translateX(${-bannerPos * 100}%)`;
      const realIndex = ((bannerPos - 1) % bannerN + bannerN) % bannerN;
      libraryBanner.querySelectorAll('#heroDots i').forEach((dot, i) => dot.classList.toggle('is-active', i === realIndex));
    };
    const stepBanner = (delta) => { if (bannerAnimating) return; bannerPos += delta; bannerAnimating = true; paintBanner(true); };
    const renderBanner = () => {
      const moodSlide = `<div class="hero-slide hero-slide--mood"><div class="hero-bubble"><span class="bl">和包工球一起</span><span class="bl">把家变成梦想中的样子!</span></div><img class="hero-mascot" src="../../assets/mascot/mascot-happy.png" alt="" /></div>`;
      const slides = [moodSlide, ...BANNER_CASES.map((item) => `<div class="hero-slide hero-slide--case" data-case="${item.id}" data-video="${item.videoId}" style="background-image:url(${item.image})" role="button" tabindex="0" aria-label="查看案例 ${item.blogger}"><span class="hero-case-tag">${item.tag}</span><div class="hero-case-foot"><div class="hero-case-blogger">${item.blogger}</div><div class="hero-case-cta">查看案例 ›</div></div></div>`)];
      bannerN = slides.length;
      const chain = [slides[bannerN - 1], ...slides, slides[0]].join(''); // 克隆末 + 全部 + 克隆首
      const dots = slides.map((_, i) => `<i class="${i === 0 ? 'is-active' : ''}"></i>`).join('');
      libraryBanner.innerHTML = `<div class="hero-viewport" id="heroViewport"><div class="hero-track" id="heroTrack">${chain}</div></div><div class="hero-dots" id="heroDots">${dots}</div>`;
      bannerPos = 1; bannerAnimating = false; paintBanner(false);
      const track = libraryBanner.querySelector('#heroTrack');
      track.addEventListener('transitionend', () => {
        if (bannerPos === bannerN + 1) { bannerPos = 1; paintBanner(false); }
        else if (bannerPos === 0) { bannerPos = bannerN; paintBanner(false); }
        bannerAnimating = false;
      });
      // 指针拖拽（阈值 40px；移动 <10px 视为点击，交给委托处理案例跳转）
      const viewport = libraryBanner.querySelector('#heroViewport');
      let startX = null;
      viewport.addEventListener('pointerdown', (event) => { startX = event.clientX; bannerDragged = false; try { viewport.setPointerCapture(event.pointerId); } catch (_) {} });
      viewport.addEventListener('pointermove', (event) => { if (startX !== null && Math.abs(event.clientX - startX) > 10) bannerDragged = true; });
      const endDrag = (event) => { if (startX === null) return; const dx = event.clientX - startX; const wasTap = !bannerDragged && Math.abs(dx) < 10; startX = null; if (dx < -40) { stepBanner(1); return; } if (dx > 40) { stepBanner(-1); return; } if (wasTap) { const el = document.elementFromPoint(event.clientX, event.clientY); const caseSlide = el && el.closest('[data-case]'); if (caseSlide && caseSlide.dataset.video) location.href = `../my-home/index.html?case=${encodeURIComponent(caseSlide.dataset.video)}`; } }; // 指针捕获会吞掉 click，故 tap 跳转在此处理（elementFromPoint 定位案例卡）；左划(dx<0)前进 / 右划(dx>0)后退
      viewport.addEventListener('pointerup', endDrag);
      viewport.addEventListener('pointercancel', () => { startX = null; });
      libraryBanner.querySelector('#heroDots').addEventListener('click', (event) => { const i = [...libraryBanner.querySelectorAll('#heroDots i')].indexOf(event.target); if (i >= 0 && !bannerAnimating && i + 1 !== bannerPos) { bannerPos = i + 1; bannerAnimating = true; paintBanner(true); } });
    };
    const renderHome = () => {
      libraryContent.classList.remove('is-case');
      const previousTabs = home.querySelector('.furniture-tabs');
      const previousTabScrollLeft = previousTabs?.scrollLeft || 0;
      disposeTemplatePreviews(home);
      // 主入口感：顶部 banner 承担案例大图，紧接着是功能图标栏（案例/户型/家具/风格四个入口），
      // 内容流只留精选家具。案例与户型原来的横滑 rail 收进图标，页面短一大截。
      const fnGrid = `<nav class="fn-grid" aria-label="灵感库功能入口">${FN_ENTRIES.map((entry) => `<button class="fn-item" data-fn="${entry.id}" aria-label="${entry.label}"><span class="fn-icon fn-icon--${entry.id}"><img src="${FN_ICON_ROOT}/${entry.id}.png" alt="" width="42" height="42" loading="lazy" decoding="async" /></span><b>${entry.label}</b></button>`).join('')}</nav>`;

      const allData = isAllFurniture ? 'furniture' : `furniture:${activeFurnitureCategory}`;

      home.innerHTML = `${fnGrid}<section class="catalog-section"><div class="section-head"><span class="section-tag">精选家具</span><button class="all-button" data-all="furniture">全部</button></div><div class="furniture-tabs" role="tablist" aria-label="家具子类">${tabs}</div><div class="furniture-grid">${furniture.map((asset) => card(asset, 'furniture-card')).join('')}<button class="furniture-card all-card" data-all="${allData}" aria-label="查看全部${allLabel}"><span>查看全部</span></button></div></section>`;
      renderTemplatePreviews(home);
      const nextTabs = home.querySelector('.furniture-tabs');
      const selectedTab = nextTabs?.querySelector('[aria-selected="true"]');
      if (!nextTabs || !selectedTab) return;
      nextTabs.scrollLeft = previousTabScrollLeft;
      const railRect = nextTabs.getBoundingClientRect();
      const tabRect = selectedTab.getBoundingClientRect();
      if (tabRect.left < railRect.left) nextTabs.scrollLeft += tabRect.left - railRect.left;
      if (tabRect.right > railRect.right) nextTabs.scrollLeft += tabRect.right - railRect.right;
    };
    // 主页案例卡上的「N 件组件」：场景 JSON 异步到达后回填，失败就留空不报错
    const paintCaseCounts = (root = catalog) => {
      root.querySelectorAll('[data-case-count]').forEach((node) => {

          .then((scene) => {
            const spec = roomSpec(scene);

          })
          .catch(() => { node.textContent = ''; });
      });
    };

    // ---------- 筛选器（底部半屏 sheet）----------
    // 草稿态：sheet 里的勾选先落在 draft，点「查看 N 件」才提交到 filter，取消/关闭即丢弃。
    const draft = { categories: new Set(), styles: new Set() };
    const renderFilterSheet = () => {
      const base = getAssets('furniture');
      const hit = applyFilter(base, draft.categories, draft.styles);
      // 每个选项的计数按「对面那组的当前选择」算，选出来必然非空；算出 0 的选项置灰不可点
      const catRow = FURNITURE_CATEGORIES.map((category) => {

      }).join('');
      const styleRow = styleFacets(base).map((facet) => {

      }).join('');
      sheetBody.innerHTML = `<div class="sheet-head"><span class="sheet-spacer" aria-hidden="true"></span><b>筛选</b><button class="sheet-close" data-sheet-close aria-label="关闭">✕</button></div>
        <div class="fs-scroll">
          <div class="fs-group"><div class="fs-label">品类</div><div class="fs-opts">${catRow}</div></div>
          <div class="fs-group"><div class="fs-label">风格</div><div class="fs-opts">${styleRow}</div></div>
        </div>
        <div class="fs-actions"><button class="fs-reset" id="fsReset" type="button" ${draft.categories.size || draft.styles.size ? '' : 'disabled'}>重置</button><button class="fs-apply" id="fsApply" type="button" ${hit.length ? '' : 'disabled'}>查看 ${hit.length} 件</button></div>`;
    };
    const openFilterSheet = () => {
      draft.categories = new Set(filter.categories);
      draft.styles = new Set(filter.styles);
      renderFilterSheet();
      manageSheet.hidden = false;
      requestAnimationFrame(() => manageSheet.classList.add('is-open'));
    };
    const applyFilterSheet = () => {
      filter.categories = new Set(draft.categories);
      filter.styles = new Set(draft.styles);
      closeSheet();
      renderCatalog();
    };

    // ---------- 风格图鉴 ----------
    // ⚠️ 占位文案：先起草一版让页面跑起来，口径未定，后续由产品统一重写。
    // 风格名单归 Amber，这里只是「有就配文案、没有就走兜底」，新增风格不会漏渲染。
    const STYLE_COPY = {
      现代: '干净利落的直线条，收纳藏起来，视觉不添乱',
      北欧: '浅木色打底，留白多，暖而不腻',
      复古: '深木与旧铜，有年代感的物件混搭',
      工业风: '金属与裸色，灯具常常是主角',
      自然风: '绿植和原生材质，像把户外搬进屋',
      简约: '少即是多，只留必需品',
      奶油风: '米白与燕麦色，柔光感的家',
      极简: '近乎留白，只保留一两件焦点',
      卡通: '圆润造型和跳色，带点玩心',
      中式: '对称与木作，含蓄的东方感',
      可爱风: '小尺寸、软轮廓，讨喜的细节',
      卡通风: '明快配色，像走进插画里',
      温馨风: '暖光和织物，回家就想窝着',
    };
    const styleCopyOf = (name) => STYLE_COPY[name] || `${name}的家具组件`;

    // 配色与材质都是从该风格资产的 labels.colors / labels.materials 实时统计出来的，
    // 不是给每个风格手写一套主题色——Amber 增删资产或改标签，这里自动跟着变。
    // 只做「中文色名 → 十六进制」的显示映射；认不出的词跳过，不猜。
    const COLOR_HEX = {
      白色:'#f5f4f0', 米白:'#f0e8da', 米白色:'#f0e8da', 米色:'#e3d3b6', 米黄:'#ecd9ae',
      浅木色:'#dcc0a0', 原木色:'#c79a63', 棕色:'#8a6647', 深棕色:'#5c4130', 深褐色:'#4a3325',
      黑色:'#2f2f2f', 深灰色:'#6b6b68', 灰色:'#9a9a97', 浅灰:'#c7c7c4', 浅灰色:'#c7c7c4', 银色:'#c0c3c6',
      绿色:'#6a8f5f', 浅绿色:'#a8c49a', 蓝色:'#5b7fa6', 浅蓝:'#a8c4d9',
      黄色:'#e0b64a', 金色:'#c9a44c', 橙色:'#d98a4a', 红色:'#b5544c', 粉色:'#e3b3ba',

    const topOf = (list, key, n) => {
      const count = new Map();
      list.forEach((asset) => (asset[key] || []).forEach((value) => count.set(value, (count.get(value) || 0) + 1)));
      return [...count.entries()].sort((a, b) => b[1] - a[1]).slice(0, n).map(([value]) => value);
    };
    const stylePalette = (name) => topOf(styleAssets(name), 'colors', 6).map((word) => COLOR_HEX[word]).filter(Boolean).slice(0, 4);
    const styleMaterials = (name) => topOf(styleAssets(name), 'materials', 3);
    // 兑白：直接拿原色当卡片底会压住文字，混到 ~80% 白度只留色相
    const tint = (hex, ratio = .8) => {
      const n = parseInt(hex.slice(1), 16);
      const mix = (c) => Math.round(c + (255 - c) * ratio);
      return `rgb(${mix(n >> 16 & 255)},${mix(n >> 8 & 255)},${mix(n & 255)})`;
    };
    // 代表图：不做美术资源，从资产里挑。两个讲究：
    // ①标签越少的资产越专一（只挂「北欧」的比同时挂「现代+北欧」的更能代表北欧）；
    // ②跨风格去重，否则多风格资产会让几个风格共用同一张图（现代/自然风曾同用一张绿植）。
    const coverCache = new Map();
    const buildCovers = () => {
      coverCache.clear();

      styleFacets(getAssets('furniture')).forEach(({ name }) => {

          .filter((asset) => asset.thumbnail && (asset.styles || []).includes(name))
          .sort((a, b) => (a.styles || []).length - (b.styles || []).length)
          .find((asset) => !used.has(asset.thumbnail));
        if (pick) { used.add(pick.thumbnail); coverCache.set(name, pick.thumbnail); }
      });
    };
    const styleCover = (name) => {
      if (!coverCache.size) buildCovers();
      return coverCache.get(name) || '';
    };
    const styleAssets = (name) => getAssets('furniture').filter((asset) => (asset.styles || []).includes(name));
    const GALLERY_MIN = 3; // 显示阈值（不是改数据）：不足 3 件的风格收进「更多风格」，Amber 清理标签后自动变好

    // 家具几何：移植自 my-home createAssetGroup，按 primitive/color/accent 拼装
    function buildFurniture(THREE, asset) {

      const sizeLabel = asset.kind === 'furniture' ? (asset.sizeStatus === 'known' ? '实测尺寸' : '展示比例') : '';
      viewerMeta.textContent = [labelByKind[asset.kind], catLabel, materials, sizeLabel, provenance].filter(Boolean).join(' · ');
      viewerStyles.innerHTML = (asset.styles || []).map((style) => `<span class="vs-tag">${style}</span>`).join(''); // 无风格标签时 :empty 自动隐藏
      viewer.hidden = false;
      disposeTemplatePreviews(viewerStage);
      const showPhoto = () => {
        if (asset.thumbnail) viewerStage.innerHTML = `<div class="viewer-photo"><img src="${asset.thumbnail}" alt="${asset.name}" /></div>`;
        else viewerStage.innerHTML = visual(asset);
      };
      if (asset.kind === 'floorplan' && asset.templateId) {
        viewerStage.innerHTML = `<div class="component-visual visual--floorplan"><canvas data-template-preview="${asset.templateId}" aria-label="${asset.name} 3D 户型预览"></canvas></div>`;
        requestAnimationFrame(() => { viewer.classList.add('is-open'); renderTemplatePreview(viewerStage.querySelector('canvas'), asset.templateId); });
      } else if (use3D) {
        viewerStage.innerHTML = '<span class="viewer-hint">拖动可 360° 查看</span>';
        requestAnimationFrame(async () => {
          viewer.classList.add('is-open');
          const ok = await open3DViewer(asset);
          if (!ok && viewerAssetId === id) { viewer3D?.dispose(); viewer3D = null; showPhoto(); } // GLB 失败兜底照片
        });
      } else if (asset.thumbnail) {
        viewerStage.innerHTML = `<div class="viewer-photo"><img src="${asset.thumbnail}" alt="${asset.name}" /><span class="viewer-photo-note">3D 预览由后端提供</span></div>`;
        requestAnimationFrame(() => viewer.classList.add('is-open'));
      } else {
        viewerStage.innerHTML = visual(asset);
        requestAnimationFrame(() => viewer.classList.add('is-open'));
      }
    }
    function closeViewer() {
      viewer.classList.remove('is-open');
      disposeTemplatePreviews(viewerStage);
      viewer3D?.dispose(); viewer3D = null; viewerAssetId = null;
      setTimeout(() => { viewer.hidden = true; }, 220);
    }
    viewerName.addEventListener('change', () => {
      const asset = getAsset(viewerAssetId); if (!asset || !isUser(asset)) return;
      asset.name = viewerName.value.trim() || asset.name; viewerName.value = asset.name;
      addUserAsset(asset); showToast('组件名称已更新'); rerender();
    });
    viewerName.addEventListener('input', fitViewerName);
    // 收藏（所有组件都可收藏）
    const syncViewerFav = () => { const on = viewerAssetId && getFavorites().has(viewerAssetId); viewerFav.setAttribute('aria-pressed', on ? 'true' : 'false'); viewerFav.querySelector('.vf-heart').textContent = on ? '♥' : '♡'; viewerFav.querySelector('.vf-text').textContent = on ? '已收藏' : '收藏'; };
    viewerFav.addEventListener('click', () => { if (!viewerAssetId) return; toggle(viewerAssetId); syncViewerFav(); });
    // 删除（仅用户组件）→ 先弹「删除后不可恢复」二次确认
    viewerDelete.addEventListener('click', () => { if (!viewerAssetId) return; openDelConfirm({ type: 'single', id: viewerAssetId }); });
    viewerSource.addEventListener('click', () => {
      const href = sourceFeedHref(getAsset(viewerAssetId)); if (!href) return;
      location.href = href;
    }); // 仅视频资产跳「刷一刷」准确来源

    // ---------- 删除二次确认弹窗 ----------
    const delConfirm = document.getElementById('delConfirm');
    const delConfirmOk = document.getElementById('delConfirmOk');
    const delConfirmText = document.getElementById('delConfirmText');
    let pendingDelete = null;
    function openDelConfirm(payload) {
      pendingDelete = payload;
      const count = payload.type === 'batch' ? payload.ids.length : 1;
      delConfirmText.textContent = count > 1 ? `将删除 ${count} 个组件，删除后不可恢复。` : '删除后不可恢复。';
      delConfirm.hidden = false; requestAnimationFrame(() => delConfirm.classList.add('is-open'));
    }
    function closeDelConfirm() { delConfirm.classList.remove('is-open'); pendingDelete = null; setTimeout(() => { delConfirm.hidden = true; }, 200); }
    delConfirmOk.addEventListener('click', () => {
      if (!pendingDelete) return;
      if (pendingDelete.type === 'single') { removeUserAsset(pendingDelete.id); closeDelConfirm(); closeViewer(); showToast('已删除该组件'); rerender(); }
      else { const n = pendingDelete.ids.length; pendingDelete.ids.forEach((id) => removeUserAsset(id)); closeDelConfirm(); exitSelect(true); renderCatalog(); showToast(`已删除 ${n} 个组件`); }
    });

    // ---------- 管理浮层 ----------
    const manageSheet = document.getElementById('manageSheet');
    const sheetBody = document.getElementById('sheetBody');
    const ENTRIES = [
      { label: '去拍一张', emoji: '📷', href: '../capture/index.html' },
      { label: '去刷一刷', emoji: '☝️', href: '../discover/index.html' },
    ];
    function renderSheet(kind) {
      if (kind === 'add') {
        sheetBody.innerHTML = `<div class="sheet-head"><button class="sheet-back" id="sheetBack" aria-label="返回">‹</button><b>新增组件</b><button class="sheet-close" data-sheet-close aria-label="关闭">✕</button></div>`
          + ENTRIES.map((e) => `<a class="sheet-row" href="${e.href}"><span>${e.emoji}</span><b>${e.label}</b><span class="arrow">›</span></a>`).join('');
      } else {
        sheetBody.innerHTML = `<div class="sheet-head"><span class="sheet-spacer" aria-hidden="true"></span><b>管理</b><button class="sheet-close" data-sheet-close aria-label="关闭">✕</button></div>`
          + `<button class="sheet-row" id="sheetAdd">新增<span class="arrow">›</span></button>`
          + `<button class="sheet-row" id="sheetDelete">删除<span class="arrow">›</span></button>`;
      }
    }
    function openSheet(kind) { renderSheet(kind); manageSheet.hidden = false; requestAnimationFrame(() => manageSheet.classList.add('is-open')); }
    function closeSheet() { manageSheet.classList.remove('is-open'); setTimeout(() => { manageSheet.hidden = true; }, 240); }

    // ---------- 删除选择模式 ----------
    function enterSelect() { select.on = true; select.ids.clear(); renderCatalog(); }
    function exitSelect(silent = false) { select.on = false; select.ids.clear(); selectBar.hidden = true; if (!silent) renderCatalog(); }
    const selectBar = document.getElementById('selectBar');
    const confirmDelete = document.getElementById('confirmDelete');
    confirmDelete.addEventListener('click', () => {
      if (!select.ids.size) return;
      openDelConfirm({ type: 'batch', ids: [...select.ids] });
    });

    // ---------- 事件委托（单监听器） ----------
    document.addEventListener('click', (event) => {
      // 弹窗 / 浮层关闭
      if (event.target.closest('[data-del-cancel]')) { closeDelConfirm(); return; }
      if (event.target.closest('#viewerClose') || event.target.closest('[data-viewer-close]')) { closeViewer(); return; }
      if (event.target.closest('[data-sheet-close]')) { closeSheet(); return; }
      if (event.target.closest('#sheetBack')) { renderSheet('main'); return; }
      if (event.target.closest('#sheetAdd')) { renderSheet('add'); return; }
      if (event.target.closest('#sheetDelete')) { closeSheet(); enterSelect(); return; }
      if (event.target.closest('#manageOpen')) { openSheet('main'); return; }
      if (event.target.closest('#selectCancel')) { exitSelect(); return; }
      // 选择模式：点卡片切换选中
      if (select.on) {
        const selectable = event.target.closest('[data-selectable]');
        if (selectable) { const id = selectable.dataset.asset; select.ids.has(id) ? select.ids.delete(id) : select.ids.add(id); renderCatalog(); return; }
        if (event.target.closest('.component-card--locked')) { showToast('平台组件库内容，暂不支持删除'); }
        return;
      }
      const favorite = event.target.closest('[data-favorite]');
      if (favorite) { event.stopPropagation(); toggle(favorite.dataset.favorite); return; }
      const all = event.target.closest('[data-all]');
      if (all) { const [kind, category] = all.dataset.all.split(':'); openCatalog(kind, category); return; }
      const fnItem = event.target.closest('[data-fn]');
      if (fnItem) {
        const id = fnItem.dataset.fn;
        location.hash = id === 'cases' ? 'cases' : id === 'styles' ? 'styles' : `catalog=${id}`;
        return;
      }
      const styleOpen = event.target.closest('[data-style-open]');
      if (styleOpen) { location.hash = `style=${encodeURIComponent(styleOpen.dataset.styleOpen)}`; return; }
      const caseOpen = event.target.closest('[data-case-open]');
      if (caseOpen) { if(caseOpen.dataset.caseHref){location.href=caseOpen.dataset.caseHref;return;} location.hash = `case=${encodeURIComponent(caseOpen.dataset.caseOpen)}`; return; }
      if (event.target.closest('#caseSaveAll')) { saveWholeCase(); return; }
      if (event.target.closest('#filterOpen')) { openFilterSheet(); return; }
      if (event.target.closest('#filterClear')) { filter.categories.clear(); filter.styles.clear(); renderCatalog(); return; }
      const untagCat = event.target.closest('[data-untag-cat]');
      if (untagCat) { filter.categories.delete(untagCat.dataset.untagCat); renderCatalog(); return; }
      const untagStyle = event.target.closest('[data-untag-style]');
      if (untagStyle) { filter.styles.delete(untagStyle.dataset.untagStyle); renderCatalog(); return; }
      const fsCat = event.target.closest('[data-fs-cat]');
      if (fsCat) { const id = fsCat.dataset.fsCat; draft.categories.has(id) ? draft.categories.delete(id) : draft.categories.add(id); renderFilterSheet(); return; }
      const fsStyle = event.target.closest('[data-fs-style]');
      if (fsStyle) { const name = fsStyle.dataset.fsStyle; draft.styles.has(name) ? draft.styles.delete(name) : draft.styles.add(name); renderFilterSheet(); return; }
      if (event.target.closest('#fsReset')) { draft.categories.clear(); draft.styles.clear(); renderFilterSheet(); return; }
      if (event.target.closest('#fsApply')) { applyFilterSheet(); return; }
      const tab = event.target.closest('[data-category]');
      if (tab) { activeFurnitureCategory = tab.dataset.category; renderHome(); return; }
      if (event.target.closest('#catalogBack')) {
        // 逐级退回：家具列表 → 风格详情 → 风格图鉴 → 主页，不一路弹回首页
        if (location.hash.startsWith('#style=')) { location.hash = 'styles'; return; }
        if (view.caseId) { location.hash = 'cases'; return; } // 案例详情退回「同款小家」列表，与风格链路同构（banner 直接点进来的也先落到列表，再退主页）
        if (['#cases','#styles'].includes(location.hash)) { location.hash = ''; return; } const fromMyHome = new URLSearchParams(location.search).get('from') === 'myhome'; if (fromMyHome && view.kind === 'floorplan' && !view.favoriteOnly) { location.href = '../my-home/index.html'; return; } if (location.hash) location.hash = ''; else route(); return; } // 唯一例外：从「我的家」进来的户型全部页返回我的家；其余回灵感库主页
      const caseSlide = event.target.closest('[data-case]');
      if (caseSlide) { if (bannerDragged) { bannerDragged = false; return; } const videoId = caseSlide.dataset.video; if (videoId) location.hash = `case=${encodeURIComponent(videoId)}`; return; } // 先进灵感库案例详情页；要套用再从那里跳我的家
      const asset = event.target.closest('[data-asset]');
      if (asset) openViewer(asset.dataset.asset);
    });
    window.addEventListener('hashchange', route);
    renderBanner();
    route();
    // 首屏先用缓存立即渲染，再用后端用户库覆盖刷新。
    // 失败时保留上次成功同步的资产，不阻断灵感库浏览。
    syncBackendUserAssets().then(rerender).catch((error) => console.warn('[DreamHome API] user library sync unavailable', error));
  </script>
</body>
</html>
