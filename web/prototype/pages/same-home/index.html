<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f2e3" />
  <title>DreamHome · 同款小家</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(90deg, #faf4e6, #fefdf8 48%, #f8f2e3);
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }
  </style>
</head>
<body>
  <iframe id="sameHome" title="同款小家 3D 空间" allow="fullscreen"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('case') || '';
    const target = new URL('../my-home/index.html', window.location.href);
    if (videoId) target.searchParams.set('case', videoId);
    target.searchParams.set('entry', 'same-home');
    if (params.get('visitor') === '1') target.searchParams.set('visitor', '1');
    document.querySelector('#sameHome').src = target.href;
  </script>
</body>
</html>
