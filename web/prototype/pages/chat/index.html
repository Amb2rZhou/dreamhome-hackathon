<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f2f2f2" />
  <link rel="icon" href="data:," />
  <title>DreamHome · 好友消息</title>
  <link rel="stylesheet" href="../my-home/dreamhome-d-system.css" />
  <link rel="stylesheet" href="../shared/status-bar.css" />
  <style>
    :root { color-scheme:light; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:var(--dh-font-sans); color:#171717; background:linear-gradient(90deg,#faf4e6,#fefdf8 48%,#f8f2e3); }
    button,textarea { font:inherit; }
    button,a { -webkit-tap-highlight-color:transparent; }
    .preview-stage { min-height:100vh; display:grid; place-items:center; padding:28px 18px; }
    .chat-shell { position:relative; }
    .chat-screen { background:#f2f2f2; }
    .chat-screen .dh-statusbar { background:#f2f2f2; color:#171717; }
    .chat-app { position:relative; height:calc(100% - 50px); display:flex; flex-direction:column; min-height:0; }
    .chat-head { height:51px; flex:none; display:grid; grid-template-columns:42px 34px minmax(0,1fr) auto; align-items:center; gap:7px; padding:0 11px 0 8px; border-bottom:1px solid #dfdfdf; background:#f2f2f2; }
    .back { width:38px; height:38px; border:0; padding:0; display:grid; place-items:center; background:transparent; color:#171717; text-decoration:none; font-size:29px; line-height:1; }
    .avatar { width:32px; height:32px; flex:none; display:grid; place-items:center; border-radius:50%; background:var(--avatar,#94ad9d); color:#fff; font-size:11px; font-weight:var(--dh-font-weight-heavy); }
    .friend-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:var(--dh-font-weight-bold); }
    .head-actions { display:flex; gap:4px; }
    .head-actions button { width:29px; height:34px; padding:0; border:0; background:transparent; color:#292929; font-size:16px; }
    .messages { flex:1; min-height:0; overflow-y:auto; padding:15px 11px 22px; scrollbar-width:none; }
    .messages::-webkit-scrollbar { display:none; }
    .date { margin:0 0 15px; color:#777; font-size:9px; text-align:center; }
    .empty { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#8a8a8a; text-align:center; }
    .empty img { width:64px; height:64px; object-fit:contain; opacity:.8; }
    .empty b { margin-top:8px; color:#575757; font-size:12px; }
    .empty span { margin-top:5px; font-size:9px; }
    .message { display:flex; align-items:flex-start; gap:7px; margin:0 0 15px; }
    .message.outgoing { flex-direction:row-reverse; }
    .message-avatar { width:30px; height:30px; font-size:9px; }
    .bubble { max-width:208px; padding:9px 11px; border-radius:13px; background:#fff; box-shadow:0 2px 7px rgba(0,0,0,.04); font-size:11px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; }
    .outgoing .bubble { background:#d9f0ca; }
    .home-share { --share-glass:rgba(255,250,240,.74); width:224px; overflow:hidden; border:1px solid rgba(255,255,255,.74); border-radius:20px; background:var(--share-glass); box-shadow:0 12px 30px rgba(96,67,29,.15),inset 0 1px rgba(255,255,255,.76); -webkit-backdrop-filter:blur(18px) saturate(1.08); backdrop-filter:blur(18px) saturate(1.08); }
    .home-card { display:block; position:relative; padding:6px; color:inherit; text-decoration:none; background:rgba(255,250,240,.58); transition:transform .18s ease,box-shadow .18s ease; -webkit-backdrop-filter:blur(16px) saturate(1.08); backdrop-filter:blur(16px) saturate(1.08); }
    .home-card:active { transform:scale(.985); }
    .home-card:focus-visible { outline:3px solid rgba(237,174,65,.5); outline-offset:-3px; }
    .home-visual { position:relative; z-index:2; height:172px; overflow:visible; }
    .home-photo { position:absolute; z-index:1; inset:0; overflow:hidden; border-radius:15px; background:linear-gradient(145deg,#eadac4 0 42%,#b9c3aa 43% 58%,#947259 59% 100%); clip-path:path("M 0 0 H 212 V 172 H 168 C 156 172 151 164 146 157 C 139 147 130 143 117 143 H 0 Z"); }
    .home-photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .home-photo::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,250,240,.02) 48%,rgba(71,47,20,.12)); pointer-events:none; }
    .home-brand { position:absolute; z-index:4; top:5px; right:5px; min-height:20px; padding:3px 5px 3px 4px; display:flex; align-items:center; gap:3px; border:1px solid rgba(255,255,255,.68); border-radius:9px; background:var(--share-glass); color:#5c472e; box-shadow:0 3px 9px rgba(75,52,24,.09),inset 0 1px rgba(255,255,255,.66); -webkit-backdrop-filter:blur(14px) saturate(1.08); backdrop-filter:blur(14px) saturate(1.08); }
    .home-brand svg { width:12px; height:12px; flex:none; fill:none; stroke:#6f4c26; stroke-width:1.55; stroke-linecap:round; stroke-linejoin:round; }
    .home-brand b { font-size:5.8px; line-height:1; white-space:nowrap; }
    .home-invite-bubble { position:absolute; z-index:4; right:58px; bottom:50px; min-width:70px; padding:8px 9px; border:1px solid rgba(255,255,255,.68); border-radius:18px; background:var(--share-glass); color:#493721; box-shadow:0 4px 12px rgba(69,45,18,.11); -webkit-backdrop-filter:blur(14px) saturate(1.08); backdrop-filter:blur(14px) saturate(1.08); font-size:8px; font-weight:var(--dh-font-weight-bold); line-height:1.35; }
    .home-invite-bubble::after { content:""; position:absolute; right:13px; bottom:-6px; width:13px; height:13px; background:inherit; transform:rotate(45deg); }
    .home-invite-bubble em { position:relative; z-index:1; color:#efb34b; font-style:normal; }
    .home-mascot { position:absolute; z-index:5; right:-13px; bottom:-34px; width:140px; height:140px; object-fit:contain; filter:drop-shadow(0 6px 7px rgba(62,42,20,.16)); pointer-events:none; }
    .home-copy { position:relative; z-index:1; min-height:123px; margin-top:-29px; padding:23px 10px 10px; border:1px solid rgba(255,255,255,.58); border-radius:0 0 15px 15px; background:var(--share-glass); box-shadow:inset 0 1px rgba(255,255,255,.5); -webkit-backdrop-filter:blur(18px) saturate(1.08); backdrop-filter:blur(18px) saturate(1.08); }
    .home-eyebrow,.home-title,.home-copy small { display:block; }
    .home-eyebrow { color:#48331f; font-size:10px; font-weight:var(--dh-font-weight-heavy); line-height:1.2; }
    .home-title { position:relative; z-index:1; width:max-content; max-width:100%; margin-top:3px; color:#392615; font-size:var(--home-title-size,20px); font-weight:900; line-height:1.15; letter-spacing:-.045em; white-space:nowrap; }
    .home-title::after { content:""; position:absolute; z-index:-1; left:-2px; right:-3px; bottom:-5px; height:7px; border-bottom:2px solid #f5bb48; border-radius:50%; transform:rotate(-1deg); }
    .home-card-foot { margin-top:15px; display:flex; align-items:flex-end; justify-content:space-between; gap:6px; }
    .home-copy small { max-width:115px; color:#836d53; font-size:7px; line-height:1.45; }
    .home-cta { min-height:30px; padding:0 4px 0 10px; display:flex; align-items:center; gap:6px; border-radius:999px; background:linear-gradient(180deg,#ffd478,#f4b83f); color:#4c3519; box-shadow:0 5px 12px rgba(193,126,26,.22); font-size:8px; font-weight:var(--dh-font-weight-heavy); white-space:nowrap; }
    .home-cta i { width:23px; height:23px; display:grid; place-items:center; border-radius:50%; background:#fffaf0; color:#5c4326; font-size:17px; font-style:normal; line-height:1; }
    .read { margin-top:4px; color:#999; font-size:7px; text-align:right; }
    .composer { min-height:60px; flex:none; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:7px; padding:8px 9px 17px; background:#f2f2f2; border-top:1px solid rgba(0,0,0,.04); }
    .composer textarea { width:100%; height:36px; resize:none; border:0; border-radius:8px; outline:none; padding:10px 9px; background:#fff; color:#222; font-size:10px; line-height:16px; }
    .composer button { height:34px; min-width:48px; padding:0 12px; border:0; border-radius:8px; background:#70886f; color:#fff; font-size:10px; font-weight:var(--dh-font-weight-bold); }
    .composer button:disabled { opacity:.42; }
    .dh-home-indicator { position:absolute; z-index:70; left:50%; bottom:7px; width:112px; height:4px; transform:translateX(-50%); border-radius:999px; background:rgba(16,17,20,.86); }
    @media (max-width:420px) { .preview-stage { padding:0; } .chat-shell { width:100vw; height:100vh; padding:0; border-radius:0; background:transparent; box-shadow:none; } .chat-screen { border-radius:0; } }
  </style>
</head>
<body>
  <main class="preview-stage">
    <section class="dh-phone-shell chat-shell" aria-label="DreamHome 好友消息">
      <div class="dh-screen dh-root chat-screen">
        <div class="dh-island" aria-hidden="true"></div>
        <div class="dh-statusbar"><span class="status-time">9:41</span><div class="status-icons" aria-hidden="true"><div class="bars"><i></i><i></i><i></i></div><span>5G</span><div class="bat"></div></div></div>
        <div class="chat-app">
          <header class="chat-head">
            <a class="back" id="chatBack" href="../my-home/index.html" aria-label="返回我的家">‹</a>
            <span class="avatar" id="friendAvatar">A</span>
            <b class="friend-name" id="friendName">Amber</b>
            <div class="head-actions"><button aria-label="语音通话">⌕</button><button aria-label="更多">•••</button></div>
          </header>
          <main class="messages" id="messages" aria-live="polite"></main>
          <form class="composer" id="composer">
            <textarea id="messageInput" maxlength="120" rows="1" placeholder="发消息…" aria-label="消息内容"></textarea>
            <button id="sendButton" type="submit" disabled>发送</button>
          </form>
        </div>
        <div class="dh-home-indicator" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <script type="module">
    import { getFriends, addMessage, getConversation } from '../shared/social-demo-data.js';

    const params = new URLSearchParams(location.search);
    const friends = getFriends();
    const friend = friends.find((item) => item.id === params.get('friend')) || friends[0];
    const ui = {
      avatar: document.getElementById('friendAvatar'),
      name: document.getElementById('friendName'),
      back: document.getElementById('chatBack'),
      messages: document.getElementById('messages'),
      composer: document.getElementById('composer'),
      input: document.getElementById('messageInput'),
      send: document.getElementById('sendButton'),
    };
    const escapeText = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const homePreview = (homeId) => {
      try {
        const store = JSON.parse(localStorage.getItem('dreamhome.my-home.homes.v1') || 'null');
        const homes = Array.isArray(store?.homes) ? store.homes : [];
        return homes.find((home) => home?.id === homeId)?.previewImage || '';
      } catch {
        return '';
      }
    };
    const timeLabel = (value) => {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat('zh-CN', { hour:'2-digit', minute:'2-digit', hour12:false }).format(date);
    };
    const roomTypeLabel = (home) => {
      if (home.roomType) return String(home.roomType);
      const name = String(home.name || '');
      return ['公寓','客厅','卧室','餐厅','书房','厨房','玄关','阳台'].find((word) => name.includes(word)) || '理想家';
    };
    const titleSize = (name) => Math.max(9, Math.min(20, Math.floor(190 / (String(name).length + 2))));

    ui.avatar.textContent = friend.avatar || friend.name.slice(0, 1);
    ui.avatar.style.setProperty('--avatar', friend.accent || '#94ad9d');
    ui.name.textContent = friend.name;
    document.title = `DreamHome · ${friend.name}`;

    function renderMessage(message) {
      const outgoing = message.senderId === 'me';
      const avatar = outgoing ? '我' : (friend.avatar || friend.name.slice(0, 1));
      const avatarColor = outgoing ? '#c49a78' : (friend.accent || '#94ad9d');
      if (message.type === 'home_share' && message.home?.id) {
        const home = message.home;
        const href = `../my-home/index.html?home=${encodeURIComponent(home.id)}&mode=locked`;
        const preview = homePreview(home.id);
        const homeName = home.name || '我的家';
        const roomType = roomTypeLabel(home);
        const subtitle = roomType === '理想家' ? '喜欢这里的家具或户型，可以收藏到你的灵感库' : `喜欢这个${roomType}的家具和布局，可以收藏到你的灵感库`;
        return `<article class="message ${outgoing ? 'outgoing' : 'incoming'}"><span class="avatar message-avatar" style="--avatar:${escapeText(avatarColor)}">${escapeText(avatar)}</span><div><div class="home-share"><a class="home-card" href="${href}" aria-label="参观 ${escapeText(homeName)}，并收藏喜欢的家具或户型"><div class="home-visual"><div class="home-photo">${preview?`<img src="${escapeText(preview)}" alt="${escapeText(homeName)} 预览" />`:''}</div><span class="home-brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10.5 8-6.5 8 6.5"/><path d="M6.5 9.2V20h11V9.2"/><circle cx="10" cy="13" r=".8"/><circle cx="14" cy="13" r=".8"/><path d="M10.5 20v-4h3v4"/></svg><b>DreamHome理想家</b></span><span class="home-invite-bubble">来我家<br>一起看看吧！ <em>♥</em></span><img class="home-mascot" src="../../assets/mascot/dreamhome-master-share-v2.png" alt="" aria-hidden="true" /></div><div class="home-copy"><span class="home-eyebrow">邀请你来参观我的</span><b class="home-title" style="--home-title-size:${titleSize(homeName)}px">「${escapeText(homeName)}」</b><div class="home-card-foot"><small>${escapeText(subtitle)}</small><span class="home-cta">一起看看 <i>›</i></span></div></div></a></div><div class="read">${escapeText(timeLabel(message.createdAt))}${outgoing ? ' · 已送达' : ''}</div></div></article>`;
      }
      return `<article class="message ${outgoing ? 'outgoing' : 'incoming'}"><span class="avatar message-avatar" style="--avatar:${escapeText(avatarColor)}">${escapeText(avatar)}</span><div><div class="bubble">${escapeText(message.text)}</div><div class="read">${escapeText(timeLabel(message.createdAt))}</div></div></article>`;
    }

    function render() {
      const conversation = getConversation(friend.id);
      if (!conversation.length) {
        ui.messages.innerHTML = '<div class="empty"><img src="../../assets/mascot/mascot-ui.png" alt="" /><b>还没有消息</b><span>从「我的家」分享一个空间给好友吧</span></div>';
        return;
      }
      const latestDay = new Intl.DateTimeFormat('zh-CN', { month:'long', day:'numeric' }).format(new Date(conversation.at(-1).createdAt));
      const latestHome = [...conversation].reverse().find((message) => message.type === 'home_share' && message.home?.id)?.home;
      if (latestHome) ui.back.href = `../my-home/index.html?home=${encodeURIComponent(latestHome.id)}&mode=locked`;
      ui.messages.innerHTML = `<div class="date">${escapeText(latestDay)}</div>${conversation.map(renderMessage).join('')}`;
      requestAnimationFrame(() => { ui.messages.scrollTop = ui.messages.scrollHeight; });
    }

    ui.input.addEventListener('input', () => { ui.send.disabled = !ui.input.value.trim(); });
    ui.composer.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = ui.input.value.trim();
      if (!text) return;
      addMessage({ friendId:friend.id, senderId:'me', type:'text', text });
      ui.input.value = '';
      ui.send.disabled = true;
      render();
    });
    render();
  </script>
</body>
</html>
