<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f2f2f2" />
  <link rel="icon" href="data:," />
  <title>DreamHome · 好友消息</title>
  <link rel="stylesheet" href="../my-home/dreamhome-d-system.css" />
  <link rel="stylesheet" href="../shared/status-bar.css" />
  <style>
    :root { color-scheme:light; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:var(--dh-font-sans); color:#171717; background:linear-gradient(90deg,#faf4e6,#fefdf8 48%,#f8f2e3); }
    button,textarea { font:inherit; }
    button,a { -webkit-tap-highlight-color:transparent; }
    .preview-stage { min-height:100vh; display:grid; place-items:center; padding:28px 18px; }
    .chat-shell { position:relative; }
    .chat-screen { background:#f2f2f2; }
    .chat-screen .dh-statusbar { background:#f2f2f2; color:#171717; }
    .chat-app { position:relative; height:calc(100% - 50px); display:flex; flex-direction:column; min-height:0; }
    .chat-head { height:51px; flex:none; display:grid; grid-template-columns:42px 34px minmax(0,1fr) auto; align-items:center; gap:7px; padding:0 11px 0 8px; border-bottom:1px solid #dfdfdf; background:#f2f2f2; }
    .back { width:38px; height:38px; border:0; padding:0; display:grid; place-items:center; background:transparent; color:#171717; text-decoration:none; font-size:29px; line-height:1; }
    .avatar { width:32px; height:32px; flex:none; display:grid; place-items:center; border-radius:50%; background:var(--avatar,#94ad9d); color:#fff; font-size:11px; font-weight:var(--dh-font-weight-heavy); }
    .friend-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:var(--dh-font-weight-bold); }
    .head-actions { display:flex; gap:4px; }
    .head-actions button { width:29px; height:34px; padding:0; border:0; background:transparent; color:#292929; font-size:16px; }
    .messages { flex:1; min-height:0; overflow-y:auto; padding:15px 11px 22px; scrollbar-width:none; }
    .messages::-webkit-scrollbar { display:none; }
    .date { margin:0 0 15px; color:#777; font-size:9px; text-align:center; }
    .empty { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#8a8a8a; text-align:center; }
    .empty img { width:64px; height:64px; object-fit:contain; opacity:.8; }
    .empty b { margin-top:8px; color:#575757; font-size:12px; }
    .empty span { margin-top:5px; font-size:9px; }
    .message { display:flex; align-items:flex-start; gap:7px; margin:0 0 15px; }
    .message.outgoing { flex-direction:row-reverse; }
    .message-avatar { width:30px; height:30px; font-size:9px; }
    .bubble { max-width:208px; padding:9px 11px; border-radius:13px; background:#fff; box-shadow:0 2px 7px rgba(0,0,0,.04); font-size:11px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; }
    .outgoing .bubble { background:#d9f0ca; }
    .home-share { --share-glass:rgba(255,250,240,.74); width:224px; overflow:hidden; border:1px solid rgba(255,255,255,.74); border-radius:20px; background:var(--share-glass); box-shadow:0 12px 30px rgba(96,67,29,.15),inset 0 1px rgba(255,255,255,.76); -webkit-backdrop-filter:blur(18px) saturate(1.08); backdrop-filter:blur(18px) saturate(1.08); }
    .home-card { display:block; position:relative; width:100%; padding:6px; border:0; color:inherit; text-align:left; background:rgba(255,250,240,.58); cursor:pointer; transition:transform .18s ease,box-shadow .18s ease; -webkit-backdrop-filter:blur(16px) saturate(1.08); backdrop-filter:blur(16px) saturate(1.08); }
    .home-card:active { transform:scale(.985); }
    .home-card:focus-visible { outline:3px solid rgba(237,174,65,.5); outline-offset:-3px; }
    .home-visual { position:relative; z-index:2; height:152px; overflow:visible; }
    .home-photo { position:absolute; z-index:1; inset:0; overflow:hidden; border-radius:15px; background:linear-gradient(145deg,#eadac4 0 42%,#b9c3aa 43% 58%,#947259 59% 100%); clip-path:path("M 0 0 H 212 V 152 H 169 C 158 152 153 145 147 139 C 139 130 128 126 114 126 H 0 Z"); }
    .home-photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .home-photo::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,250,240,.02) 48%,rgba(71,47,20,.12)); pointer-events:none; }
    .home-brand { position:absolute; z-index:4; top:5px; right:5px; min-height:20px; padding:3px 5px 3px 4px; display:flex; align-items:center; gap:3px; border:1px solid rgba(255,255,255,.68); border-radius:9px; background:var(--share-glass); color:#5c472e; box-shadow:0 3px 9px rgba(75,52,24,.09),inset 0 1px rgba(255,255,255,.66); -webkit-backdrop-filter:blur(14px) saturate(1.08); backdrop-filter:blur(14px) saturate(1.08); }
    .home-brand svg { width:12px; height:12px; flex:none; fill:none; stroke:#6f4c26; stroke-width:1.55; stroke-linecap:round; stroke-linejoin:round; }
    .home-brand b { font-size:5.8px; line-height:1; white-space:nowrap; }
    .home-invite-bubble { position:absolute; z-index:6; left:74px; bottom:24px; width:max-content; max-width:93px; padding:7px 9px; border:0; border-radius:14px 14px 4px 14px; background:rgba(250,250,251,.97); color:#292d33; filter:drop-shadow(0 7px 11px rgba(31,38,48,.14)); -webkit-backdrop-filter:blur(18px) saturate(1.14); backdrop-filter:blur(18px) saturate(1.14); text-align:left; font-size:7.2px; font-weight:var(--dh-font-weight-bold); line-height:1.3; }
    .home-invite-bubble::after { content:""; position:absolute; z-index:-1; right:-8px; bottom:-1px; width:18px; height:15px; background:rgba(250,250,251,.97); clip-path:polygon(0 0,100% 100%,0 100%); }
    .home-invite-bubble em { position:relative; z-index:1; color:#efb34b; font-style:normal; }
    /* The waving Package Ball straddles the photo/copy seam like the approved
       share-card reference. Keep the transparent source uncropped. */
    .home-mascot-slot { position:absolute; z-index:7; right:0; bottom:-8px; width:82px; height:80px; overflow:visible; pointer-events:none; }
    .home-mascot { position:absolute; right:-6px; bottom:0; width:88px; height:auto; object-fit:contain; object-position:center bottom; filter:drop-shadow(0 5px 7px rgba(62,42,20,.17)); }
    .home-copy { position:relative; z-index:1; min-height:102px; margin-top:-18px; padding:17px 10px 9px; border:1px solid rgba(255,255,255,.58); border-radius:0 0 15px 15px; background:var(--share-glass); box-shadow:inset 0 1px rgba(255,255,255,.5); -webkit-backdrop-filter:blur(18px) saturate(1.08); backdrop-filter:blur(18px) saturate(1.08); }
    .home-eyebrow,.home-title,.home-copy small { display:block; }
    .home-eyebrow { color:#48331f; font-size:10px; font-weight:var(--dh-font-weight-heavy); line-height:1.2; }
    .home-title { position:relative; z-index:1; width:max-content; max-width:100%; margin-top:3px; color:#392615; font-size:var(--home-title-size,20px); font-weight:900; line-height:1.15; letter-spacing:-.045em; white-space:nowrap; }
    .home-title::after { content:""; position:absolute; z-index:-1; left:-2px; right:-3px; bottom:-5px; height:7px; border-bottom:2px solid #f5bb48; border-radius:50%; transform:rotate(-1deg); }
    .home-copy-mark { position:absolute; color:#efb548; pointer-events:none; }
    .home-copy-mark.star { top:14px; right:55px; font-size:12px; transform:rotate(8deg); }
    .home-copy-mark.heart { left:107px; bottom:11px; font-size:8px; }
    .home-copy-mark.strokes { right:8px; bottom:45px; width:12px; height:11px; border-top:2px solid #efb548; transform:rotate(-22deg); }
    .home-copy-mark.strokes::before,.home-copy-mark.strokes::after { content:""; position:absolute; width:5px; border-top:2px solid #efb548; }
    .home-copy-mark.strokes::before { top:4px; right:-1px; transform:rotate(27deg); }
    .home-copy-mark.strokes::after { top:-5px; left:2px; transform:rotate(70deg); }
    .home-card-foot { margin-top:10px; display:flex; align-items:flex-end; justify-content:space-between; gap:6px; }
    .home-copy small { max-width:115px; color:#836d53; font-size:7px; line-height:1.45; }
    .home-cta { min-height:27px; padding:0 3px 0 9px; display:flex; align-items:center; gap:5px; border-radius:999px; background:linear-gradient(180deg,#ffd478,#f4b83f); color:#4c3519; box-shadow:0 5px 12px rgba(193,126,26,.22); font-size:7.5px; font-weight:var(--dh-font-weight-heavy); white-space:nowrap; }
    .home-cta i { width:21px; height:21px; display:grid; place-items:center; border-radius:50%; background:#fffaf0; color:#5c4326; font-size:15px; font-style:normal; line-height:1; }
    .read { margin-top:4px; color:#999; font-size:7px; text-align:right; }
    .composer { min-height:60px; flex:none; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:7px; padding:8px 9px 17px; background:#f2f2f2; border-top:1px solid rgba(0,0,0,.04); }
    .composer textarea { width:100%; height:36px; resize:none; border:0; border-radius:8px; outline:none; padding:10px 9px; background:#fff; color:#222; font-size:10px; line-height:16px; }
    .composer button { height:34px; min-width:48px; padding:0 12px; border:0; border-radius:8px; background:#70886f; color:#fff; font-size:10px; font-weight:var(--dh-font-weight-bold); }
    .composer button:disabled { opacity:.42; }
    .detail-backdrop { position:absolute; z-index:80; inset:0; border:0; padding:0; background:rgba(37,29,21,.22); opacity:0; pointer-events:none; transition:opacity .24s ease; }
    .detail-backdrop.is-open { opacity:1; pointer-events:auto; }
    .home-detail-sheet { position:absolute; z-index:81; left:0; right:0; bottom:0; height:58%; min-height:360px; display:flex; flex-direction:column; overflow:hidden; border-radius:25px 25px 0 0; background:rgba(255,252,246,.94); box-shadow:0 -18px 48px rgba(69,47,24,.18); transform:translateY(102%); transition:transform .28s cubic-bezier(.2,.8,.2,1),height .28s ease,border-radius .28s ease; -webkit-backdrop-filter:blur(22px) saturate(1.06); backdrop-filter:blur(22px) saturate(1.06); }
    .home-detail-sheet.is-open { transform:translateY(0); }
    .home-detail-sheet.is-full { height:calc(100% - 50px); border-radius:0; }
    .detail-grabber { width:38px; height:4px; flex:none; margin:7px auto 3px; border-radius:999px; background:#dbcdb8; }
    .detail-head { min-height:42px; flex:none; display:grid; grid-template-columns:minmax(0,1fr) 34px 34px; align-items:center; gap:5px; padding:0 12px 4px 16px; }
    .detail-head div { min-width:0; }
    .detail-head small,.detail-head b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .detail-head small { color:#9a8165; font-size:8px; }
    .detail-head b { margin-top:2px; color:#392b1e; font-size:13px; }
    .detail-icon { width:31px; height:31px; display:grid; place-items:center; padding:0; border:1px solid rgba(113,82,47,.1); border-radius:50%; background:#f5eee2; color:#5c4936; }
    .detail-icon svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .detail-body { flex:1; min-height:0; overflow-y:auto; padding:0 12px 84px; scrollbar-width:none; }
    .detail-body::-webkit-scrollbar { display:none; }
    .detail-scene { position:relative; height:118px; overflow:hidden; border-radius:17px; background:linear-gradient(145deg,#eadac4,#b6c1ab 55%,#97735a); box-shadow:inset 0 0 0 1px rgba(255,255,255,.55); transition:height .28s ease; }
    .is-full .detail-scene { height:205px; }
    .detail-scene img { width:100%; height:100%; object-fit:cover; }
    .detail-scene::after { content:"3D 空间预览"; position:absolute; left:9px; bottom:8px; padding:4px 7px; border-radius:999px; background:rgba(255,251,243,.78); color:#59442e; font-size:7px; font-weight:var(--dh-font-weight-bold); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
    .furniture-head { margin:13px 2px 8px; display:flex; align-items:end; justify-content:space-between; }
    .furniture-head b { color:#35291e; font-size:12px; }
    .furniture-head span { color:#9a836b; font-size:8px; }
    .furniture-list { display:grid; gap:7px; }
    .furniture-item { min-height:52px; display:grid; grid-template-columns:45px minmax(0,1fr) auto; align-items:center; gap:9px; padding:6px 7px; border:1px solid rgba(126,92,53,.08); border-radius:14px; background:rgba(255,255,255,.66); }
    .furniture-thumb { width:45px; height:40px; display:grid; place-items:center; overflow:hidden; border-radius:10px; background:#eee3d2; color:#8c704f; font-size:17px; }
    .furniture-thumb img { width:100%; height:100%; object-fit:cover; }
    .furniture-meta { min-width:0; }
    .furniture-meta b,.furniture-meta small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .furniture-meta b { color:#463525; font-size:10px; }
    .furniture-meta small { margin-top:3px; color:#9b846d; font-size:7px; }
    .collect-button { min-width:51px; height:28px; padding:0 9px; border:1px solid #e9b850; border-radius:999px; background:#fffaf0; color:#7b5727; font-size:8px; font-weight:var(--dh-font-weight-bold); }
    .collect-button.is-collected { border-color:#ddd3c4; background:#eee9e1; color:#8c8174; }
    .detail-empty { padding:22px 10px; border-radius:14px; background:rgba(255,255,255,.52); color:#99836d; font-size:9px; text-align:center; }
    .detail-actions { position:absolute; left:0; right:0; bottom:0; display:flex; gap:8px; padding:10px 13px 17px; background:linear-gradient(180deg,rgba(255,252,246,0),rgba(255,252,246,.98) 24%); }
    .detail-actions a { height:42px; flex:1; display:flex; align-items:center; justify-content:center; border-radius:14px; background:#463524; color:#fff9ef; text-decoration:none; font-size:11px; font-weight:var(--dh-font-weight-bold); box-shadow:0 8px 18px rgba(70,53,36,.18); }
    .dh-home-indicator { position:absolute; z-index:70; left:50%; bottom:7px; width:112px; height:4px; transform:translateX(-50%); border-radius:999px; background:rgba(16,17,20,.86); }
    @media (max-width:420px) { .preview-stage { padding:0; } .chat-shell { width:100vw; height:100vh; padding:0; border-radius:0; background:transparent; box-shadow:none; } .chat-screen { border-radius:0; } }
  </style>
</head>
<body>
  <main class="preview-stage">
    <section class="dh-phone-shell chat-shell" aria-label="DreamHome 好友消息">
      <div class="dh-screen dh-root chat-screen">
        <div class="dh-island" aria-hidden="true"></div>
        <div class="dh-statusbar"><span class="status-time">9:41</span><div class="status-icons" aria-hidden="true"><div class="bars"><i></i><i></i><i></i></div><span>5G</span><div class="bat"></div></div></div>
        <div class="chat-app">
          <header class="chat-head">
            <a class="back" id="chatBack" href="../my-home/index.html" aria-label="返回我的家">‹</a>
            <span class="avatar" id="friendAvatar">A</span>
            <b class="friend-name" id="friendName">Amber</b>
            <div class="head-actions"><button aria-label="语音通话">⌕</button><button aria-label="更多">•••</button></div>
          </header>
          <main class="messages" id="messages" aria-live="polite"></main>
          <form class="composer" id="composer">
            <textarea id="messageInput" maxlength="120" rows="1" placeholder="发消息…" aria-label="消息内容"></textarea>
            <button id="sendButton" type="submit" disabled>发送</button>
          </form>
        </div>
        <button class="detail-backdrop" id="detailBackdrop" type="button" aria-label="关闭家的详情"></button>
        <section class="home-detail-sheet" id="homeDetailSheet" aria-label="家的详情" aria-hidden="true">
          <div class="detail-grabber" aria-hidden="true"></div>
          <header class="detail-head"><div><small>好友分享的理想家</small><b id="detailTitle">家的详情</b></div><button class="detail-icon" id="detailExpand" type="button" aria-label="扩大至整屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button><button class="detail-icon" id="detailClose" type="button" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
          <div class="detail-body"><div class="detail-scene" id="detailScene"></div><div class="furniture-head"><b>这个家用了什么</b><span id="detailCount"></span></div><div class="furniture-list" id="detailFurniture"></div></div>
          <div class="detail-actions"><a id="detailEnter3d" href="../my-home/index.html">进入 3D 参观</a></div>
        </section>
        <div class="dh-home-indicator" aria-hidden="true"></div>
      </div>
    </section>
  </main>
  <script type="module">
    import { getFriends, addMessage, getConversation } from '../shared/social-demo-data.js?v=20260810d';
    import { getAsset, getFavorites, addCanonicalAssetToLibrary } from '../shared/asset-library-data.js?v=20260810e';

    const params = new URLSearchParams(location.search);
    const friends = getFriends();
    const friend = friends.find((item) => item.id === params.get('friend')) || friends[0];
    const ui = {
      avatar: document.getElementById('friendAvatar'),
      name: document.getElementById('friendName'),
      back: document.getElementById('chatBack'),
      messages: document.getElementById('messages'),
      composer: document.getElementById('composer'),
      input: document.getElementById('messageInput'),
      send: document.getElementById('sendButton'),
      detailBackdrop: document.getElementById('detailBackdrop'),
      detailSheet: document.getElementById('homeDetailSheet'),
      detailTitle: document.getElementById('detailTitle'),
      detailScene: document.getElementById('detailScene'),
      detailCount: document.getElementById('detailCount'),
      detailFurniture: document.getElementById('detailFurniture'),
      detailEnter3d: document.getElementById('detailEnter3d'),
      detailExpand: document.getElementById('detailExpand'),
      detailClose: document.getElementById('detailClose'),
    };
    const escapeText = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
    const homeProject = (homeId) => {
      try {
        const store = JSON.parse(localStorage.getItem('dreamhome.my-home.homes.v1') || 'null');
        const homes = Array.isArray(store?.homes) ? store.homes : [];
        return homes.find((home) => home?.id === homeId) || null;
      } catch {
        return null;
      }
    };
    const homePreview = (homeId) => homeProject(homeId)?.previewImage || '';
    const timeLabel = (value) => {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat('zh-CN', { hour:'2-digit', minute:'2-digit', hour12:false }).format(date);
    };
    const roomTypeLabel = (home) => {
      if (home.roomType) return String(home.roomType);
      const name = String(home.name || '');
      return ['公寓','客厅','卧室','餐厅','书房','厨房','玄关','阳台'].find((word) => name.includes(word)) || '理想家';
    };
    const titleSize = (name) => Math.max(9, Math.min(20, Math.floor(190 / (String(name).length + 2))));
    let detailHome = null;

    const furnitureForHome = (home) => {
      if (Array.isArray(home?.furniture) && home.furniture.length) return home.furniture;
      const project = homeProject(home.id);
      const placements = Array.isArray(project?.placements) ? project.placements : [];
      const seen = new Set();
      return placements.map((placement) => {
        const assetId = placement?.assetId;
        if (!assetId || seen.has(assetId)) return null;
        seen.add(assetId);
        const asset = getAsset(assetId);
        return { id:assetId, name:asset?.name || placement.name || '家居单品', category:asset?.category || '家具', thumbnail:asset?.thumbnail || '' };
      }).filter(Boolean);
    };

    function renderFurniture(home) {
      const items = furnitureForHome(home);
      const favorites = getFavorites();
      ui.detailCount.textContent = items.length ? `${items.length} 件可收藏` : '清单同步中';
      ui.detailFurniture.innerHTML = items.length ? items.map((item) => {
        const collected = favorites.has(item.id);
        return `<article class="furniture-item"><span class="furniture-thumb">${item.thumbnail ? `<img src="${escapeText(item.thumbnail)}" alt="" loading="lazy" />` : '⌑'}</span><span class="furniture-meta"><b>${escapeText(item.name)}</b><small>${escapeText(item.category)} · 来自这个空间</small></span><button class="collect-button${collected ? ' is-collected' : ''}" type="button" data-collect-asset="${escapeText(item.id)}" ${collected ? 'disabled' : ''}>${collected ? '✓ 已收藏' : '+ 收藏'}</button></article>`;
      }).join('') : '<div class="detail-empty">家具清单正在同步，仍可先进入 3D 参观这个家</div>';
    }

    function openHomeDetail(home, shareId = '', ownerId = '') {
      detailHome = home;
      const project = homeProject(home.id);
      const preview = home.cover?.url || home.coverImage || home.previewImage || project?.shareCover?.url || project?.coverImage || project?.previewImage || '';
      const name = home.name || project?.name || '我的家';
      ui.detailTitle.textContent = name;
      ui.detailScene.innerHTML = preview ? `<img src="${escapeText(preview)}" alt="${escapeText(name)} 3D 缩略图" />` : '';
      ui.detailEnter3d.href = `../my-home/index.html?home=${encodeURIComponent(home.id)}&mode=locked&source=friend-share&friend=${encodeURIComponent(friend.id)}&shareId=${encodeURIComponent(shareId)}&ownerId=${encodeURIComponent(ownerId || friend.id)}`;
      renderFurniture(home);
      ui.detailSheet.classList.remove('is-full');
      ui.detailExpand.setAttribute('aria-label', '扩大至整屏');
      ui.detailExpand.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';
      ui.detailSheet.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => {
        ui.detailBackdrop.classList.add('is-open');
        ui.detailSheet.classList.add('is-open');
      });
    }

    function closeHomeDetail() {
      ui.detailBackdrop.classList.remove('is-open');
      ui.detailSheet.classList.remove('is-open', 'is-full');
      setTimeout(() => {
        ui.detailSheet.setAttribute('aria-hidden', 'true');
        detailHome = null;
      }, 280);
    }

    function toggleDetailSize() {
      const full = ui.detailSheet.classList.toggle('is-full');
      ui.detailExpand.setAttribute('aria-label', full ? '收回半屏' : '扩大至整屏');
      ui.detailExpand.innerHTML = full
        ? '<svg viewBox="0 0 24 24"><path d="M9 9H4V4M15 9h5V4M9 15H4v5M15 15h5v5"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';
    }

    ui.avatar.textContent = friend.avatar || friend.name.slice(0, 1);
    ui.avatar.style.setProperty('--avatar', friend.accent || '#94ad9d');
    ui.name.textContent = friend.name;
    document.title = `DreamHome · ${friend.name}`;

    function renderMessage(message) {
      const outgoing = message.senderId === 'me';
      const avatar = outgoing ? '我' : (friend.avatar || friend.name.slice(0, 1));
      const avatarColor = outgoing ? '#c49a78' : (friend.accent || '#94ad9d');
      if (message.type === 'home_share' && message.home?.id) {
        const home = message.home;
        const preview = home.cover?.url || home.coverImage || home.previewImage || homePreview(home.id);
        const homeName = home.name || '我的家';
        const roomType = roomTypeLabel(home);
        const subtitle = roomType === '理想家' ? '喜欢这里的家具或户型，可以收藏到你的灵感库' : `喜欢这个${roomType}的家具和布局，可以收藏到你的灵感库`;
        const ownerId=home.originalOwnerId || (outgoing ? 'me' : friend.id);
        return `<article class="message ${outgoing ? 'outgoing' : 'incoming'}"><span class="avatar message-avatar" style="--avatar:${escapeText(avatarColor)}">${escapeText(avatar)}</span><div><div class="home-share"><button class="home-card" type="button" data-home-detail="${escapeText(home.id)}" data-share-id="${escapeText(message.id)}" data-owner-id="${escapeText(ownerId)}" aria-label="查看 ${escapeText(homeName)} 的详情，并收藏喜欢的家具"><div class="home-visual"><div class="home-photo">${preview?`<img src="${escapeText(preview)}" alt="${escapeText(homeName)} 预览" />`:''}</div><span class="home-brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10.5 8-6.5 8 6.5"/><path d="M6.5 9.2V20h11V9.2"/><circle cx="10" cy="13" r=".8"/><circle cx="14" cy="13" r=".8"/><path d="M10.5 20v-4h3v4"/></svg><b>DreamHome理想家</b></span><span class="home-invite-bubble">来我家<br>一起看看吧！ <em>♥</em></span><span class="home-mascot-slot"><img class="home-mascot" src="../../assets/mascot/share-card-wave.png" alt="" aria-hidden="true" /></span></div><div class="home-copy"><span class="home-copy-mark star">✦</span><span class="home-copy-mark heart">♥</span><span class="home-copy-mark strokes"></span><span class="home-eyebrow">邀请你来参观我的</span><b class="home-title" style="--home-title-size:${titleSize(homeName)}px">「${escapeText(homeName)}」</b><div class="home-card-foot"><small>${escapeText(subtitle)}</small><span class="home-cta">一起看看 <i>›</i></span></div></div></button></div><div class="read">${escapeText(timeLabel(message.createdAt))}${outgoing ? ' · 已送达' : ''}</div></div></article>`;
      }
      return `<article class="message ${outgoing ? 'outgoing' : 'incoming'}"><span class="avatar message-avatar" style="--avatar:${escapeText(avatarColor)}">${escapeText(avatar)}</span><div><div class="bubble">${escapeText(message.text)}</div><div class="read">${escapeText(timeLabel(message.createdAt))}</div></div></article>`;
    }

    function render() {
      const conversation = getConversation(friend.id);
      if (!conversation.length) {
        ui.messages.innerHTML = '<div class="empty"><img src="../../assets/mascot/mascot-ui.png" alt="" /><b>还没有消息</b><span>从「我的家」分享一个空间给好友吧</span></div>';
        return;
      }
      const latestDay = new Intl.DateTimeFormat('zh-CN', { month:'long', day:'numeric' }).format(new Date(conversation.at(-1).createdAt));
      ui.messages.innerHTML = `<div class="date">${escapeText(latestDay)}</div>${conversation.map(renderMessage).join('')}`;
      requestAnimationFrame(() => { ui.messages.scrollTop = ui.messages.scrollHeight; });
    }

    ui.input.addEventListener('input', () => { ui.send.disabled = !ui.input.value.trim(); });
    ui.messages.addEventListener('click', (event) => {
      const card = event.target.closest('[data-home-detail]');
      if (!card) return;
      const message = getConversation(friend.id).find((item) => item.type === 'home_share' && item.id === card.dataset.shareId && item.home?.id === card.dataset.homeDetail);
      if (message?.home) location.href = `../my-home/index.html?home=${encodeURIComponent(message.home.id)}&mode=locked&source=friend-share&friend=${encodeURIComponent(friend.id)}&shareId=${encodeURIComponent(message.id)}&ownerId=${encodeURIComponent(card.dataset.ownerId || friend.id)}`;
    });
    ui.detailBackdrop.addEventListener('click', closeHomeDetail);
    ui.detailClose.addEventListener('click', closeHomeDetail);
    ui.detailExpand.addEventListener('click', toggleDetailSize);
    ui.detailFurniture.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-collect-asset]');
      if (!button || !detailHome) return;
      const assetId = button.dataset.collectAsset;
      if (getFavorites().has(assetId)) return;
      button.disabled = true;
      button.textContent = '同步中…';
      ui.detailCount.textContent = '正在写入你的素材库';
      try {
        await addCanonicalAssetToLibrary(assetId, 'friend-share');
        renderFurniture(detailHome);
      } catch (error) {
        console.error('[DreamHome friend asset collect]', error);
        button.disabled = false;
        button.textContent = '同步失败，重试';
        ui.detailCount.textContent = '后端素材库同步失败，请重试';
      }
    });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && detailHome) closeHomeDetail(); });
    ui.composer.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = ui.input.value.trim();
      if (!text) return;
      addMessage({ friendId:friend.id, senderId:'me', type:'text', text });
      ui.input.value = '';
      ui.send.disabled = true;
      render();
    });
    render();
  </script>
</body>
</html>
