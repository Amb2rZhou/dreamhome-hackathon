    ui.matchDetailView.addEventListener('click',(event)=>{if(event.target.closest('[data-match-detail-back]')){closeMatchDetail();return;}const favorite=event.target.closest('[data-match-favorite]');if(favorite){toggleMatchFavorite(favorite.dataset.matchFavorite);return;}const place=event.target.closest('[data-match-place]');if(place)beginRecommendedPlacement(place.dataset.matchPlace);});
    ui.daylightButton.addEventListener('click',()=>{ if(!state.project||state.project.source?.type==='video_rebuild') return; const next = state.project.daylight === 'night' ? 'day' : 'night'; state.project.daylight = next; ui.daylightButton.textContent = next === 'night' ? '🌙' : '☀'; saveSoon(); tell(next === 'night' ? '已切换到黑夜' : '已切换到白天'); }); ui.realTimeSlider.addEventListener('input',()=>applyRealTimeProgress(ui.realTimeSlider.value));ui.realTimeSlider.addEventListener('change',()=>{applyRealTimeProgress(ui.realTimeSlider.value,true);if(state.project?.decor){state.project.decor.timeValue=Number(ui.realTimeSlider.value);saveSoon();}}); ui.rotateLeft.addEventListener('click',()=>rotateSelected(-1)); ui.rotateRight.addEventListener('click',()=>rotateSelected(1)); ui.scaleDown.addEventListener('click',()=>scaleSelected(1/1.15)); ui.scaleUp.addEventListener('click',()=>scaleSelected(1.15)); ui.moveSelected.addEventListener('click',()=> sceneRuntime?.beginMove()); ui.deleteSelected.addEventListener('click',deleteSelected);ui.heightUp.addEventListener('click',()=>sceneRuntime?.movePlacementHeight(.1));ui.heightDown.addEventListener('click',()=>sceneRuntime?.movePlacementHeight(-.1));
    ui.editorBack.addEventListener('click',returnToSetup); ui.shareButton.addEventListener('click',openShareSheet); ui.shareSheet.addEventListener('click',async(event)=>{ if(event.target.closest('[data-share-close]')){ closeShareSheet(); return; } const friend=event.target.closest('[data-friend-id]');if(friend){await sendHomeToFriend(friend.dataset.friendId);return;}const button=event.target.closest('[data-share]'); if(button){ closeShareSheet();try{tell(await shareCurrentHome(button.dataset.share));}catch(error){if(error?.name!=='AbortError')tell('分享没有完成，请重试');} } });
    document.addEventListener('keydown',(event)=>{if(event.key==='Escape'&&state.assistantDetailAssetId){closeMatchDetail();return;}if(event.key==='Escape'&&state.assistantOpen){closeMatchAssistant();return;}if(event.key==='Escape' && state.interaction.mode!=='orbit') exitInteraction();}); window.addEventListener('pagehide',()=>{clearTimeout(saveTimer);cancelAssistantTrial({announce:false});persistProjectNow();disposeMatchDetailPreview();});window.addEventListener('beforeunload',()=>{clearTimeout(saveTimer);cancelAssistantTrial({announce:false});persistProjectNow();disposeMatchDetailPreview();disposeScene();});
    state.phase=TARGETED_ENTRY?'scene-loading':'setup';renderTemplates();renderSavedHomes();renderVideoScenes();updatePhases();
    const requestedAssetId=QUERY.get('addAsset'),sharedSlug=QUERY.get('shared')?.trim(),assetShareSlug=QUERY.get('assetShare')?.trim();
    const requestedHomeId=QUERY.get('home')?.trim();
    // Public judge navigation points at immutable release snapshots. Open them immediately;
    // user-project hydration may continue in the background but must never
    // block the first visible frame or replace the approved transforms.
    const openedReleaseHomeImmediately=Boolean(requestedHomeId&&!FRIEND_SHARE_REQUEST&&DEFAULT_HOMES.some((home)=>home.id===requestedHomeId));
    if(openedReleaseHomeImmediately)void openHome(requestedHomeId);
    Promise.allSettled([homeSceneService.hydrate(),syncBackendUserAssets()]).then(async(results)=>{
      const projectResult=results[0];
      if(projectResult.status==='rejected')console.warn('[DreamHome] 后端项目暂不可用，继续使用本地布局',projectResult.reason);
      renderSavedHomes();renderVideoScenes();
      try{
        if(sharedSlug){await openPublishedHome(sharedSlug);return;}
        if(assetShareSlug){await openPublishedAssets(assetShareSlug);return;}
      }catch(error){console.warn('[DreamHome] 公共分享读取失败',error);tell(error.message||'分享内容暂时无法打开');return;}
      if(requestedHomeId&&!requestedAssetId){if(openedReleaseHomeImmediately)return;if(FRIEND_SHARE_REQUEST&&!sourceShareMessage()){location.replace(`../chat/index.html?friend=${encodeURIComponent(FRIEND_SHARE_VIEWER_ID)}`);return;}await openHome(requestedHomeId);return;}
      if(requestedAssetId){
        const home=homeSceneService.loadHomes()[0];
        if(home)await openHome(home.id,requestedAssetId);
        else tell('请先生成一个家，再加入组件');
      }
    });
    // 从灵感库 banner 案例卡进入：只读案例模式（复用拼装编辑器，去掉抽屉与移动/调整，加收藏）
    const caseVideoId=QUERY.get('case');
    if(caseVideoId&&!requestedAssetId){ openVideoScene(caseVideoId,'案例空间',true); }
    const assemblyId=QUERY.get('assembly');
    if(assemblyId&&!caseVideoId&&!requestedAssetId){ openSpaceAssembly(assemblyId); }
    if(new URLSearchParams(location.search).get('focus')==='templates'){requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('templateBox')?.scrollIntoView({block:'center'});history.replaceState(null,'',location.pathname);}));}
    // 从 room-setup 中间页回跳：?template=&w=&d=&h=&autogen=1
    // URL 是用户可改的，w/d/h 一律经 clampRoom 夹取后才进 state
    (function acceptRoomSetup(){
      const templateId=QUERY.get('template');
      if(!templateId||!TEMPLATES.some((item)=>item.id===templateId))return;
      selectTemplate(templateId);
      if(QUERY.has('w')||QUERY.has('d')||QUERY.has('h')){
        state.roomOverride=clampRoom({w:QUERY.get('w'),d:QUERY.get('d'),h:QUERY.get('h')},templateId);
      }
      history.replaceState(null,'',location.pathname);
      if(QUERY.get('autogen')==='1'&&!caseVideoId&&!assemblyId&&!requestedAssetId)startGeneration();
    })();
  </script>
</body>
</html>
