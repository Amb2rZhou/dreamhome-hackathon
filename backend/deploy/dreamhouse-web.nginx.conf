server {
    server_name dreamhouse.top www.dreamhouse.top;

    root /srv/dreamhouse-web;
    index index.html;
    client_max_body_size 100m;

    # Keep the browser on one origin while the FastAPI service remains bound
    # to localhost. The trailing slash intentionally removes
    # /dreamhome-api/ before forwarding, so /dreamhome-api/api/health reaches
    # FastAPI as /api/health.
    location ^~ /dreamhome-api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # These modules use stable filenames and are imported directly by HTML.
    # Revalidate them on every visit so a release can never combine new HTML
    # with a year-old module from the browser cache.
    location ^~ /prototype/pages/shared/ {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|wasm|png|jpe?g|webp|gif|svg|ico|mp4|webm|glb|gltf|bin|onnx|mp3|m4a|wav)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dreamhouse.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dreamhouse.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.dreamhouse.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = dreamhouse.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name dreamhouse.top www.dreamhouse.top;
    return 404; # managed by Certbot
}
